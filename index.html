<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="logo.png">
<style>[hidden]:not([hidden=until-found i]){display:none!important}img{max-width:100%}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<title>AEP · Mina de Serra Azul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
:root{
  --paper:#F4F4F3; --surface:#FFFFFF; --surface-2:#F8F8F7;
  --ink:#232323; --ink-2:#4F4F4F; --ink-3:#767676;
  --rule:#E0DFDD; --rule-strong:#BEBCB9;
  --brand:#EA5B26; --brand-ink:#414141;
  --accent:#C2451A; --accent-ink:#FFFFFF; --accent-soft:#FDF2EC; --accent-line:#F1B89F;
  --warn-bg:#FFF6E0; --warn-ink:#7A5200; --warn-line:#EBCB7C;
  --bad-bg:#FCEBEA; --bad-ink:#8E1C1C; --bad-line:#E9A9A5;
  --ok-bg:#E8F4EC; --ok-ink:#1E6B3E; --ok-line:#A5D2B5;
  --dot-ok:#2E7D4F; --dot-pend:#D9A21B; --crit:#A51C1C;
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#141414; --surface:#1D1D1D; --surface-2:#242424;
    --ink:#ECECEC; --ink-2:#B9B9B9; --ink-3:#8A8A8A;
    --rule:#313131; --rule-strong:#474747;
    --brand:#F07A4C; --brand-ink:#ECECEC;
    --accent:#F4885C; --accent-ink:#1A0C05; --accent-soft:#3A2218; --accent-line:#7A3D22;
    --crit:#D2453F;
    --warn-bg:#2E2510; --warn-ink:#F0CF84; --warn-line:#5E4A1C;
    --bad-bg:#321717; --bad-ink:#F2A9A4; --bad-line:#6A2A28;
    --ok-bg:#132A1D; --ok-ink:#9FD9B4; --ok-line:#2C5A3D;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#141414; --surface:#1D1D1D; --surface-2:#242424;
  --ink:#ECECEC; --ink-2:#B9B9B9; --ink-3:#8A8A8A;
  --rule:#313131; --rule-strong:#474747;
  --brand:#F07A4C; --brand-ink:#ECECEC;
  --accent:#F4885C; --accent-ink:#1A0C05; --accent-soft:#3A2218; --accent-line:#7A3D22;
  --crit:#D2453F;
  --warn-bg:#2E2510; --warn-ink:#F0CF84; --warn-line:#5E4A1C;
  --bad-bg:#321717; --bad-ink:#F2A9A4; --bad-line:#6A2A28;
  --ok-bg:#132A1D; --ok-ink:#9FD9B4; --ok-line:#2C5A3D;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-cond);font-weight:600;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:.005em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-cond);font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}

/* ---------- Topo ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--rule);box-shadow:inset 0 3px 0 var(--brand)}
.topbar-in{max-width:1400px;margin:0 auto;padding-inline:16px;padding-top:3px;display:flex;align-items:center;gap:20px;min-height:60px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;padding-block:8px;min-width:0}
.brand-logo{display:flex;align-items:center;padding-right:14px;border-right:1px solid var(--rule)}
.brand-logo img{height:30px;width:auto;display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand-logo img{background:#fff;padding:3px 6px;border-radius:4px;height:32px}}
:root[data-theme="dark"] .brand-logo img{background:#fff;padding:3px 6px;border-radius:4px;height:32px}
.login{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:16px}
.login form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--rule);border-top:3px solid var(--brand);border-radius:var(--radius);padding:26px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.login img{height:36px;width:auto;align-self:flex-start}
.login h1{font-size:20px}
.login .msg{font-size:12.5px;color:var(--bad-ink);min-height:1.2em}
.brand-txt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-txt b{font-family:var(--f-cond);font-size:18px;font-weight:700;letter-spacing:.04em;color:var(--brand-ink)}
.brand-txt span{font-size:11.5px;color:var(--ink-3)}
@media (max-width:560px){.brand-txt span{display:none}}
.nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.nav button{background:none;border:0;padding:8px 12px;border-radius:var(--radius);cursor:pointer;color:var(--ink-2);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft);font-weight:600}
.savestate{font-size:12px;color:var(--ink-3);min-width:90px;text-align:right}

.wrap{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:22px 60px}

/* ---------- Controles ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule-strong);background:var(--surface);padding:8px 14px;border-radius:var(--radius);cursor:pointer;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn:not(.primary):not(.ghost):not(.danger):hover{color:var(--accent);border-color:var(--accent-line)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding-inline:8px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--bad-ink);border-color:var(--bad-line)}
.btn.small{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:5px;min-width:0}
label.f > span:not(.hint){font-size:12px;font-weight:600;color:var(--ink-2)}
label.f > span em{font-style:normal;color:var(--bad-ink)}
.hint{font-size:11.5px;color:var(--ink-3);line-height:1.45}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--surface);border:1px solid var(--rule-strong);border-radius:var(--radius);padding:8px 10px;min-width:0}
textarea{resize:vertical;min-height:72px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.spanall{grid-column:1/-1}
@media (max-width:760px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.span2,.span3{grid-column:auto}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
label.row > input[type=checkbox]{flex:none}
label.row > input[type=checkbox] + span{flex:1 1 0;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.stack.tight{gap:8px}

/* ---------- Superfícies ---------- */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.panel-h{padding:13px 18px;border-bottom:1px solid var(--rule);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.panel-b{padding:18px}
.note{border:1px solid var(--rule);background:var(--surface-2);border-radius:var(--radius);padding:10px 12px;font-size:12.5px;color:var(--ink-2)}
.note.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.note.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad-ink)}
.note.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-ink)}
.note b{font-weight:600}

/* ---------- Chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--rule-strong);color:var(--ink-2);background:var(--surface);white-space:nowrap}
.chip.fav{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok-ink)}
.chip.int{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn-ink)}
.chip.ris{border-color:var(--bad-line);background:var(--bad-bg);color:var(--bad-ink)}
.chip.draft{border-color:var(--warn-line);color:var(--warn-ink);background:var(--warn-bg)}
.chip.done{border-color:var(--ok-line);color:var(--ok-ink);background:var(--ok-bg)}
.code{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--accent)}

/* ---------- Lista de AEPs ---------- */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{font-size:28px;font-weight:700;padding-left:12px;border-left:4px solid var(--brand)}
.pagehead p{margin-top:4px;color:var(--ink-2);max-width:68ch}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:18px}
.stat{padding-left:12px;border-left:2px solid var(--rule)}
.stat b{display:block;font-family:var(--f-cond);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--ink-3)}
.tablewrap{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;min-width:760px}
table.list th{text-align:left;font-family:var(--f-cond);font-weight:600;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--surface-2)}
table.list td{padding:12px 14px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:var(--surface-2)}
table.list tr:last-child td{border-bottom:0}
.empty{padding:38px 18px;text-align:center;color:var(--ink-2)}

/* ---------- Editor da AEP ---------- */
.editor{display:grid;grid-template-columns:230px minmax(0,1fr) 290px;gap:20px;align-items:start}
@media (max-width:1180px){.editor{grid-template-columns:210px minmax(0,1fr)}.aside{grid-column:1/-1}}
@media (max-width:760px){.editor{grid-template-columns:minmax(0,1fr)}}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.rail button{width:100%;display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;text-align:left;background:none;border:0;border-left:2px solid transparent;padding:8px 10px;cursor:pointer;color:var(--ink-2);border-radius:0 var(--radius) var(--radius) 0}
.rail button:hover{background:var(--surface);color:var(--ink)}
.rail button[aria-current="step"]{border-left-color:var(--brand);background:var(--surface);color:var(--ink);font-weight:600}
.rail button[aria-current="step"] .n{color:var(--accent)}
.rail .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.rail .dot{width:8px;height:8px;border-radius:50%;background:var(--rule-strong)}
.rail .dot.ok{background:var(--dot-ok)}
.rail .dot.pend{background:var(--dot-pend)}
@media (max-width:760px){
  .rail{position:static}
  .rail ol{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .rail li{flex:0 0 auto}
  .rail button{grid-template-columns:auto auto auto;border-left:0;border-bottom:2px solid transparent;border-radius:var(--radius) var(--radius) 0 0}
  .rail button[aria-current="step"]{border-bottom-color:var(--accent)}
  .rail .lbl{white-space:nowrap}
}
.stephead{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.stephead h2{font-size:23px;font-weight:700}
.stephead p{color:var(--ink-2);max-width:72ch}
.stepnav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.aeptitle{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.aeptitle h1{font-size:24px;font-weight:700}
.aside .panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (max-width:1180px){.aside .panel{position:static}}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpis > div{border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface-2);padding:8px 10px}
.kpis b{display:block;font-family:var(--f-cond);font-size:24px;font-weight:700;line-height:1.1;color:var(--ink)}
.kpis span{font-size:11.5px;color:var(--ink-3);line-height:1.3}
.pendlist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2)}

/* ---------- Checklist / tabelas de formulário ---------- */
.ckl{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
.ck{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;padding:12px 14px;border-bottom:1px solid var(--rule);background:var(--surface)}
.ck:last-child{border-bottom:0}
.ck.sim{background:var(--bad-bg)}
.ck .i{font-family:var(--f-mono);font-weight:600;color:var(--ink-3);padding-top:2px}
.ck p{font-size:13px}
@media (max-width:760px){.ck{grid-template-columns:30px minmax(0,1fr)}.ck .seg{grid-column:2}}
.seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:var(--radius);overflow:hidden;height:max-content}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink-2);border-right:1px solid var(--rule-strong);background:var(--surface)}
.seg label:last-of-type{border-right:0}
.seg input:checked + label{background:var(--accent);color:var(--accent-ink)}
.seg input.s-sim:checked + label{background:var(--crit);color:#fff}
.seg input:focus-visible + label{outline:2px solid var(--accent);outline-offset:-2px}

.dom{border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface)}
.dom-h{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.dom-h h3{font-size:16px}
.dom-b{padding:14px;display:flex;flex-direction:column;gap:12px}
.subs{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- Perigos ---------- */
.hz{border:1px solid var(--rule);border-left:3px solid var(--brand);border-radius:var(--radius);background:var(--surface);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px}
.hz h4{font-family:var(--f-sans);font-size:14px;font-weight:600}
.hz .meta{font-size:12px;color:var(--ink-3)}
.hz .acts{grid-row:span 3;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.edbox{border:1px solid var(--accent-line);background:var(--surface);border-radius:var(--radius)}
.edbox .panel-h{background:var(--accent-soft);border-bottom-color:var(--accent-line)}

/* ---------- Fotos ---------- */
.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.photos{grid-template-columns:minmax(0,1fr)}}
.ph{border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.ph .img{aspect-ratio:4/3;background:var(--surface-2);display:flex;align-items:center;justify-content:center;max-width:100%}
.ph .img img{width:100%;height:100%;object-fit:contain}
.ph .cap{padding:10px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--rule)}
.drop{border:1.5px dashed var(--rule-strong);border-radius:var(--radius);padding:22px;text-align:center;color:var(--ink-2);background:var(--surface);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}

/* ---------- COPSOQ por área ---------- */
.subtable{width:100%;border-collapse:collapse}
.subtable td,.subtable th{padding:7px 10px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:middle}
.subtable th{font-family:var(--f-cond);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.subtable input{max-width:92px;text-align:right}
.subtable tr.efeito td{color:var(--ink-3)}

/* ---------- Prévia do documento ---------- */
.docprev{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:0;overflow:hidden}
.docprev iframe{width:100%;height:80vh;border:0;display:block;background:#fff}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--radius);font-size:13px;z-index:50;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad-ink);padding:8px 10px;border-radius:var(--radius);font-size:12.5px}
@media (prefers-reduced-motion:no-preference){.btn,.nav button,.rail button{transition:background .12s,border-color .12s,color .12s}}
</style>

</head><body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="brand-logo"><img src="logo.png" alt="ArcelorMittal" width="68" height="28"></span><span class="brand-txt"><b>AEP</b><span>Avaliação Ergonômica Preliminar · Mina de Serra Azul</span></span></div>
    <nav class="nav" aria-label="Seções">
      <button type="button" data-go="home" id="nav-home">AEPs</button>
      <button type="button" data-go="painel" id="nav-painel">Painel</button>
      <button type="button" data-go="copsoq" id="nav-copsoq">COPSOQ por setor</button>
      <button type="button" data-go="config" id="nav-config">Unidade</button>
    </nav>
    <div class="savestate" id="savestate" aria-live="polite"></div><button class="btn ghost small" type="button" id="btn-sair">Sair</button>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="login" id="login" hidden><form id="login-form">
  <img src="logo.png" alt="ArcelorMittal">
  <div><h1>AEP · Mina de Serra Azul</h1><p class="small muted">Avaliação Ergonômica Preliminar</p></div>
  <label class="f"><span>E-mail</span><input type="text" id="login-email" autocomplete="username" inputmode="email" required></label>
  <label class="f"><span>Senha</span><input type="password" id="login-senha" autocomplete="current-password" required style="width:100%;background:var(--surface);border:1px solid var(--rule-strong);border-radius:var(--radius);padding:8px 10px"></label>
  <button class="btn primary" id="login-btn" type="submit" style="justify-content:center">Entrar</button>
  <div class="msg" id="login-msg" role="status"></div>
</form></div>

<script>
/* =========================================================================
   UTILITÁRIOS
   ========================================================================= */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const escBr = v => esc(v).replace(/\n/g,"<br>");
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)).replace(/[^a-zA-Z0-9-]/g,"");
const hojeISO = () => new Date().toISOString().slice(0,10);
const fmtData = iso => { if(!iso) return "—"; const [y,m,d] = String(iso).slice(0,10).split("-"); return d && m && y ? `${d}/${m}/${y}` : esc(iso); };
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const clamp = n => Math.min(5, Math.max(1, Math.round(Number(n) || 1)));
const num2 = v => (v === "" || v == null || isNaN(Number(v))) ? "—" : Number(v).toFixed(2).replace(".",",");
const idNum = a => Number(String(a.numero||"").replace(/\D+/g,"")) || 0;
function getPath(obj, path){ return path.split(".").reduce((o,k) => (o == null ? undefined : o[k]), obj); }
function setPath(obj, path, val){
  const ks = path.split("."); let o = obj;
  for (let i=0;i<ks.length-1;i++){ const k = ks[i]; if (o[k] == null || typeof o[k] !== "object") o[k] = /^\d+$/.test(ks[i+1]) ? [] : {}; o = o[k]; }
  o[ks[ks.length-1]] = val;
}
let toastTimer;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3400); }
function setSaveState(txt){ $("#savestate").textContent = txt; }

/* =========================================================================
   RESUMO DOS PERIGOS (só contagem — a graduação do risco é feita na planilha de controle)
   ========================================================================= */
/* Vínculo item crítico ↔ perigo: pelo item informado ao lançar (checkItem) ou pela ponte da taxonomia (coluna "itens") */
const perigoLigaItem = (h, n) => Number(h.checkItem) === n || (TAXMAP[h.codigo]?.itens || []).includes(n);
const perigoDoItem = (a, n) => (a.perigos||[]).find(h => perigoLigaItem(h, n));
const itensDoPerigo = (a, h) => (a.checklist||[]).map((c,i) => ({ c, n: i+1 })).filter(x => x.c && x.c.r === "sim" && perigoLigaItem(h, x.n)).map(x => x.n);
const temDesqualificacao = aep => (aep.checklist||[]).some(c => c && c.r === "sim");

/* =========================================================================
   COPSOQ POR SETOR
   ========================================================================= */
function faixaDe(m){ if (m === "" || m == null || isNaN(Number(m))) return null; const v = Number(m); return v < 2.34 ? "fav" : v <= 3.66 ? "int" : "ris"; }
const chipFaixa = (f, txt) => f ? `<span class="chip ${f}">${esc(txt || FAIXAS[f])}</span>` : `<span class="chip">sem dado</span>`;
const setorPorNome = nome => Object.values(S.areas).find(a => norm(a.nome) === norm(nome));
function altasDe(setor){ if (!setor) return []; return SUBS.map(s => ({ s, m: setor.medias?.[s.id] })).filter(x => faixaDe(x.m) === "ris").sort((a,b) => b.m - a.m); }
function snapDe(setor){ return setor ? { setorId: setor.id, nome: setor.nome, n: setor.n||"", onda: setor.onda||"", dataCorte: setor.dataCorte||"", dominios: clone(setor.dominios||{}), medias: clone(setor.medias||{}), atualizadoEm: setor.atualizadoEm||"" } : null; }
function copsoqDaAEP(a){ return a.copsoq?.snapshot || snapDe(setorPorNome(a.meta?.setorCopsoq)); }
function resultadoDominio(a, domId){
  const snap = copsoqDaAEP(a);
  if (snap){
    const nota = snap.dominios?.[domId];
    const subs = SUBS.filter(s => s.dom === domId).map(s => ({ s, m: snap.medias?.[s.id], f: faixaDe(snap.medias?.[s.id]) })).filter(x => x.f);
    return { auto: true, nota, faixa: faixaDe(nota), subs, altas: subs.filter(x => x.f === "ris"), inter: subs.filter(x => x.f === "int") };
  }
  const manual = a.copsoq?.dominios?.[domId]?.manual || "";
  return { auto: false, nota: null, faixa: manual || null, subs: [], altas: [], inter: [] };
}
/* Modelos de texto da observação em campo — um para cada conclusão do cruzamento.
   Trechos entre colchetes são para o analista completar; a AEP não conclui com colchetes pendentes. */
const MODELOS_OBS = [
  { id:"adequado",    rot:"Adequado — sem achado relevante",               concl:0 },
  { id:"controle",    rot:"Atenção — controles existentes",                concl:1 },
  { id:"confirmado",  rot:"Necessita melhorias — achado confirmado",       concl:2 },
  { id:"divergencia", rot:"Evidências insuficientes — aprofundar",         concl:3 },
  { id:"na",          rot:"Não aplicável",                                 concl:4 }
];
function perigosDoDominio(a, domId){
  return Array.from(new Set((a.perigos||[]).filter(h => SUBS.some(s => s.dom === domId && (h.origemCopsoq === s.id || s.tax === h.codigo))).map(h => h.codigo)));
}
function textoModelo(a, domId, tipo){
  const d = DOMINIOS.find(x => x.id === domId), r = resultadoDominio(a, domId);
  const fmt = l => l.length ? ` (${l.map(x => `${x.s.nome} ${num2(x.m)}`).join("; ")})` : "";
  const res = fmt([...r.altas, ...r.inter]), resFoco = fmt(r.altas.length ? r.altas : r.inter), cods = perigosDoDominio(a, domId);
  if (tipo === "adequado") return d.padrao;
  if (tipo === "controle") return `O resultado do setor neste domínio${res} indica ponto de atenção. Em campo, a condição foi observada, mas se mantém sob controle pelas medidas existentes: [descrever as medidas e a evidência observada — por exemplo, pausas, rodízio, apoio da liderança, canal de escuta, programa de acolhimento]. [Se houver, oportunidade de melhoria: descrever.] Recomenda-se manter as medidas e acompanhar no próximo ciclo. Nenhum perigo adicional caracterizado neste eixo.`;
  if (tipo === "confirmado") return `O resultado do setor neste domínio${resFoco} foi confirmado na observação da atividade: [descrever a condição observada — tarefa, frequência, relato dos trabalhadores]. Medidas existentes: [descrever, ou “não identificadas”]. [Suporte ou melhoria necessária: descrever.] Perigos identificados: ${cods.length ? cods.join(", ") : "[códigos]"}.`;
  if (tipo === "na") return `Domínio não aplicável a este cargo: [justificar — por que as condições avaliadas neste domínio não existem na atividade].`;
  return `O resultado do setor neste domínio${resFoco} não foi confirmado nem afastado com segurança na observação da atividade deste cargo: [descrever o que foi observado e o que falta verificar — por exemplo, a exigência sinalizada pode ser de outra função do setor, ou a condição não ocorreu no dia da avaliação]. Prevalece a observação em campo; recomenda-se aprofundar a avaliação [como: nova observação, escuta dos trabalhadores, análise documental] e revisar as medidas. Nenhum perigo caracterizado neste eixo até a conclusão da verificação.`;
}
const conclusaoSugerida = r => (!r.faixa ? "" : r.altas.length ? "" : r.faixa === "fav" && !r.inter.length ? CONCLUSOES[0] : CONCLUSOES[1]);

/* =========================================================================
   ESTADO E BANCO
   ========================================================================= */
const S = {
  view:"home", aepId:null, step:1, aeps:{}, areas:{}, config:{},
  draft:null, dirty:false, saveTimer:null,
  editHz:null, hzErr:"", hzFiltro:"", hzCat:"",
  editArea:null, areaDirty:false, areaTimer:null, colar:"", colarMsg:"",
  cfgDraft:null, cfgTimer:null, confirm:null,
  busca:"", fStatus:"", fSetor:"", exportAberto:false, expEscopo:"concluidas", expGHE:"",
  db:null, assets:null, downloads:null, dbOk:false, carregado:false
};
function proximoNumero(){ return Math.max(0, ...Object.values(S.aeps).map(idNum).filter(n => n < 1000)) + 1; }
function novaAEP(){
  const n = proximoNumero();
  return completar({ id: "AEP-" + String(n).padStart(2,"0"), numero: `AEP ${String(n).padStart(2,"0")}`, status:"andamento", criadoEm: new Date().toISOString() });
}
function completar(a){
  const r = clone(a||{});
  r.status = r.status || "nao_iniciada";
  r.meta = Object.assign({ cargo:"", setor:"", area:"", eg:"", setorCopsoq:"", cargosAbrangidos:"", justAgrup:"", turnos:"", nTrab:"", data:"", analista: S.config.analista||"", registroAnalista: S.config.registroAnalista||"" }, r.meta||{});
  if (!r.meta.analista) r.meta.analista = S.config.analista || "";
  if (!r.meta.registroAnalista) r.meta.registroAnalista = S.config.registroAnalista || "";
  r.trabalho = Object.assign({ sumaria:"", prescrito:"", real:"" }, r.trabalho||{});
  if (!r.trabalho.sumaria.trim() && r.trabalho.prescrito.trim()) r.trabalho.sumaria = r.trabalho.prescrito.trim();
  if (!r.meta.setorCopsoq) r.meta.setorCopsoq = setorPeloDepara(r.meta.setor, r.meta.area);
  r.escuta = r.escuta || []; r.perigos = r.perigos || []; r.fotos = r.fotos || [];
  r.checklist = CHECKLIST.map((_,i) => Object.assign({ r:"", obs:"" }, (r.checklist||[])[i]||{}));
  r.copsoq = Object.assign({ snapshot:null, dominios:{} }, r.copsoq||{});
  DOMINIOS.forEach(d => { const dd = r.copsoq.dominios[d.id] = Object.assign({ manual:"", obs:"", concl:"" }, r.copsoq.dominios[d.id]||{}); if (CONCL_ANTIGAS[dd.concl]) dd.concl = CONCL_ANTIGAS[dd.concl]; });
  r.aet = Object.assign({ decisao:"", gatilhos:[], justificativa:"" }, r.aet||{});
  r.conclusao = Object.assign({ interpretacao:"", parecer:"", recomendacoes: TXT_RECOMENDACOES, oportunidades:"Não há." }, r.conclusao||{});
  return r;
}
/* Setor do COPSOQ pelo DE-PARA da planilha (Setor | Área) */
const DEPARA = Object.fromEntries(Object.entries(DEPARA_RAW).map(([k,v]) => [norm(k.split("|")[0]) + "|" + norm(k.split("|")[1]||""), v]));
function setorPeloDepara(setor, area){ return DEPARA[norm(setor) + "|" + norm(area)] || ""; }
async function iniciar(){
  render();
  let db = null;
  try { db = await window.claude?.use?.("db"); } catch(e){ db = null; }
  S.db = db; S.dbOk = !!db;
  if (!db){ S.carregado = true; setSaveState("Modo sem banco — nada é salvo"); render(); return; }
  try { S.assets = await window.claude.use("assets"); } catch(e){ S.assets = null; }
  try { S.downloads = await window.claude.use("downloads"); } catch(e){ S.downloads = null; }
  db.collection("aeps").onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); });
    S.aeps = m; S.carregado = true;
    if (S.view === "home") atualizarHome(); else if (S.view === "painel") render();
  }, () => setSaveState("Erro ao ler dados"));
  db.collection("copsoq").onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); });
    S.areas = m;
    if (S.view === "copsoq" && !S.editArea) render();
    else if (S.view === "home") atualizarHome(); else if (S.view === "painel") render();
    if (S.view === "aep") { renderBanner(); if (S.step === 3) renderStep(); }
  }, () => {});
  db.doc("config/unidade").onSnapshot(d => { S.config = d.exists ? d.data() : {}; if (S.view === "config" && !S.cfgDraft) render(); if (S.view === "painel") render(); }, () => {});
}
async function salvarAEP(){
  clearTimeout(S.saveTimer);
  if (!S.draft || !S.dirty) return;
  numerarRiscos(S.draft);
  S.draft.atualizadoEm = new Date().toISOString();
  const corpo = clone(S.draft); S.aeps[corpo.id] = corpo;
  if (!S.db){ S.dirty = false; return; }
  setSaveState("Salvando…");
  try { await S.db.doc("aeps/" + corpo.id).set(corpo); S.dirty = false; setSaveState("Salvo"); }
  catch(e){ setSaveState("Erro ao salvar"); toast(e && e.code === "quota_exceeded" ? "O banco atingiu o limite de registros." : "Não foi possível salvar. Tente de novo em instantes."); }
}
function numerarRiscos(a){
  let max = Math.max(0, ...a.perigos.map(h => Number(String(h.idRisco||"").replace(/\D+/g,"")) || 0));
  a.perigos.forEach(h => { if (!h.idRisco) { max++; h.idRisco = "R" + String(max).padStart(2,"0"); } });
}
function marcar(){
  S.dirty = true;
  if (S.draft){
    if (S.draft.status === "nao_iniciada") { S.draft.status = "andamento"; renderTitulo(); }
    else if (S.draft.status === "concluida") { S.draft.status = "revisao"; S.draft.concluidoEm = null; toast("Alteração numa AEP concluída: ela passou para “Em revisão” até ser concluída de novo."); renderTitulo(); }
  }
  setSaveState("Alterações não salvas");
  clearTimeout(S.saveTimer); S.saveTimer = setTimeout(salvarAEP, 700);
}

/* =========================================================================
   PENDÊNCIAS
   ========================================================================= */
function pendencias(a){
  const p = {1:[],2:[],3:[],4:[],5:[]}, m = a.meta||{};
  if (!m.cargo?.trim()) p[1].push("Informar o cargo/função");
  if (!m.setor?.trim()) p[1].push("Informar o setor");
  if (!m.data) p[1].push("Informar a data da avaliação");
  if (!m.analista?.trim()) p[1].push("Informar o responsável técnico");
  if (!a.trabalho?.sumaria?.trim()) p[1].push("Escrever a descrição sumária da atividade");
  const semResp = (a.checklist||[]).filter(c => !c.r).length; if (semResp) p[2].push(`${semResp} item(ns) do checklist sem resposta`);
  DOMINIOS.forEach(d => { const r = resultadoDominio(a, d.id), dd = a.copsoq?.dominios?.[d.id]||{};
    if (!r.faixa) p[3].push(`${d.nome}: sem resultado`); if (!dd.obs?.trim()) p[3].push(`${d.nome}: sem observação em campo`); if (!dd.concl) p[3].push(`${d.nome}: sem conclusão`);
    if (/\[[^\]]*\]/.test(dd.obs||"")) p[3].push(`${d.nome}: complete os trechos entre colchetes da observação`);
    if ([2,3,4].some(i => dd.concl === CONCLUSOES[i]) && (dd.obs||"").trim() === d.padrao) p[3].push(`${d.nome}: a observação diz “sem achado relevante”, mas a conclusão é ${dd.concl.split(" –")[0]}`);
    if (dd.concl === CONCLUSOES[2] && !perigosDoDominio(a, d.id).length) p[3].push(`${d.nome}: conclusão “Necessita melhorias” sem perigo deste domínio lançado na etapa 4`); });
  (a.checklist||[]).forEach((c,i) => { if (c.r === "sim" && !perigoDoItem(a, i+1)) p[4].push(`Item ${i+1} do checklist marcado Sim sem perigo vinculado`); });
  (a.fotos||[]).forEach((f,i) => { if (!f.titulo?.trim()) p[4].push(`Foto ${i+1} sem legenda`); });
  if (!a.conclusao?.interpretacao) p[5].push("Escolher a interpretação da AEP");
  if (!a.aet?.decisao) p[5].push("Registrar a decisão sobre AET");
  if (!a.aet?.justificativa?.trim()) p[5].push("Justificar a decisão sobre AET");
  if (a.aet?.decisao === "sim" && !(a.aet.gatilhos||[]).length) p[5].push("Indicar o gatilho da AET (17.3.2)");
  if (!a.conclusao?.parecer?.trim()) p[5].push("Escrever as observações complementares");
  return p;
}
const totalPend = p => Object.values(p).reduce((s,l) => s + l.length, 0);
/* Mesmo alerta da coluna N da aba AEP */
function alertaAET(a){
  if (a.status !== "concluida") return "";
  const crit = ["Existem condições ergonômicas críticas na atividade","Necessita de melhorias"].includes(a.conclusao?.interpretacao);
  if (crit && !a.aet?.decisao) return "Concluída com achado relevante e sem decisão de AET";
  if (!a.aet?.decisao) return "Decisão de AET não registrada";
  if (a.aet?.decisao === "sim" && !a.aet?.justificativa) return "AET acionada sem justificativa";
  return "";
}

/* =========================================================================
   NAVEGAÇÃO
   ========================================================================= */
async function ir(view, extra){
  if (S.view === "aep") await salvarAEP();
  if (S.view === "copsoq" && S.editArea) await salvarArea();
  if (S.view === "config") await salvarConfig();
  S.view = view; S.confirm = null;
  if (view === "home" || view === "painel") { S.draft = null; S.aepId = null; S.editHz = null; }
  if (view !== "copsoq") S.editArea = null;
  if (view !== "config") S.cfgDraft = null;
  Object.assign(S, extra||{});
  render(); window.scrollTo(0,0);
}
async function abrirAEP(id){ const a = S.aeps[id]; if (!a) return; S.draft = completar(a); S.aepId = id; S.step = 1; S.editHz = null; S.dirty = false; await ir("aep"); }
async function criarAEP(){ const a = novaAEP(); S.aeps[a.id] = a; S.draft = a; S.aepId = a.id; S.step = 1; S.dirty = true; await salvarAEP(); await ir("aep"); }
function irEtapa(n){ S.step = n; S.editHz = null; S.confirm = null; renderRail(); renderStep(); renderAside(); window.scrollTo({top:0}); salvarAEP(); }

/* =========================================================================
   RENDERIZAÇÃO GERAL
   ========================================================================= */
function render(){
  const ativo = S.view === "aep" || S.view === "doc" ? "home" : S.view;
  ["home","painel","copsoq","config"].forEach(v => $("#nav-"+v).setAttribute("aria-current", ativo === v ? "page" : "false"));
  const app = $("#app");
  if (S.view === "home") app.innerHTML = vHome();
  else if (S.view === "painel") app.innerHTML = vPainel();
  else if (S.view === "aep") { app.innerHTML = vEditorShell(); renderTitulo(); renderBanner(); renderRail(); renderStep(); renderAside(); }
  else if (S.view === "doc") { app.innerHTML = vDoc(); montarPrevia(); }
  else if (S.view === "copsoq") app.innerHTML = S.editArea ? vArea() : vAreas();
  else if (S.view === "config") app.innerHTML = vConfig();
}

/* ---------------- Lista de AEPs ---------------- */
function listaFiltrada(){
  const t = norm(S.busca);
  return Object.values(S.aeps)
    .filter(a => !S.fStatus || (a.status||"nao_iniciada") === S.fStatus)
    .filter(a => !S.fSetor || (a.meta?.setor||"").trim() === S.fSetor)
    .filter(a => !t || norm(`${a.numero} ${a.meta?.cargo} ${a.meta?.setor} ${a.meta?.area} ${a.meta?.eg}`).includes(t))
    .sort((a,b) => idNum(a) - idNum(b));
}
function linhasHome(lista){
  return lista.map(a => {
    const st = a.status || "nao_iniciada", altas = altasDe(setorPorNome(a.meta?.setorCopsoq)).length, al = alertaAET(a);
    return `<tr class="click" data-open="${esc(a.id)}" tabindex="0">
      <td class="mono">${esc(a.numero)}</td>
      <td><b>${esc(a.meta?.cargo || "Sem cargo")}</b><div class="tiny faint">${esc((a.meta?.setor||"").trim())}${a.meta?.area ? " · " + esc(a.meta.area) : ""}</div></td>
      <td class="small">${esc(a.meta?.setorCopsoq || "—")}${altas ? ` <span class="chip ris" title="Subescalas acima de 3,66 no setor">${altas} alta${altas>1?"s":""}</span>` : ""}</td>
      <td><span class="chip ${STATUS_CLS[st]}">${STATUS[st]}</span>${al ? `<div class="tiny" style="color:var(--bad-ink);margin-top:3px">${esc(al)}</div>` : ""}</td>
      <td class="num">${(a.perigos||[]).length || "—"}</td>
      <td class="num">${(a.checklist||[]).filter(c => c && c.r === "sim").length || "—"}</td></tr>`;
  }).join("");
}
/* Atualiza só a tabela e a contagem, sem redesenhar os filtros (não perde o foco da busca) */

/* ---------------- Painel de andamento ---------------- */
function vPainel(){
  const L = Object.values(S.aeps), tot = L.length, c = st => L.filter(a => (a.status||"nao_iniciada") === st).length;
  const concl = c("concluida"), and = c("andamento"), nao = c("nao_iniciada"), rev = c("revisao"), pct = tot ? concl / tot : 0;

  const dias = ini ? Math.max(1, Math.round((hoje - ini) / 864e5)) : null, ritmo = dias ? concl / dias : null, faltam = tot - concl;
  const previsao = ritmo ? new Date(hoje.getTime() + (faltam / ritmo) * 864e5) : null;
  const diasMeta = meta ? Math.round((meta - hoje) / 864e5) : null, ritmoNec = diasMeta > 0 ? faltam / diasMeta : null;

    .sort((x,y) => y.al.length - x.al.length || (y.a.status==="andamento") - (x.a.status==="andamento") || y.n - x.n || idNum(x.a) - idNum(y.a)).slice(0,25);

      <div><span class="eyebrow">Previsão no ritmo atual</span><p class="num"><b>${previsao && concl >= 5 ? fmt(previsao) : "—"}</b>${concl < 5 ? '<span class="tiny faint"> (a partir de 5 concluídas)</span>' : ""}</p></div>

  <div class="grid g2" style="align-items:start">

function abrirHz(h){
  S.editHz = Object.assign({ id: uid(), codigo:"", fonte:"", danos:"", exposicao:"", checkItem:"", origemCopsoq:"" }, h);
  S.hzErr = ""; S.hzFiltro = ""; S.hzCat = h && h.codigo ? prefixo(h.codigo) : "";
}
function salvarHz(){
  const h = S.editHz, t = TAXMAP[h.codigo]; const erro = m => { S.hzErr = m; renderStep(); };
  if (!t) return erro("Selecione o perigo na taxonomia.");
  if (!h.fonte?.trim()) return erro("Descreva a fonte geradora específica desta situação.");
  const novo = clone(h); delete novo._novo; if (!novo.danos) novo.danos = t.danos;
  const i = S.draft.perigos.findIndex(x => x.id === novo.id);
  if (i >= 0) S.draft.perigos[i] = novo; else S.draft.perigos.push(novo);
  S.editHz = null; S.hzErr = ""; marcar(); numerarRiscos(S.draft); renderStep(); renderRail(); renderAside(); toast("Perigo salvo.");
}

/* ---------------- Fotos ---------------- */
async function comprimir(file){
  const url = URL.createObjectURL(file);
  try { const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); return await new Promise(ok => c.toBlob(ok, "image/jpeg", .82));
  } finally { URL.revokeObjectURL(url); }
}
async function enviarFotos(files){
  if (!S.assets) return; const lista = Array.from(files).filter(f => f.type.startsWith("image/")), msg = $("#upmsg");
  for (let k=0; k<lista.length; k++){ if (msg) msg.textContent = `Enviando foto ${k+1} de ${lista.length}…`;
    try { const r = await S.assets.upload(await comprimir(lista[k]), { type: "image/jpeg" }); S.draft.fotos.push({ id: uid(), assetId: r.id, titulo: "" }); marcar(); await salvarAEP(); }
    catch(e){ toast(e && e.code === "too_large" ? "Foto grande demais." : e && e.code === "quota_or_state" ? "O espaço para fotos acabou." : "Não foi possível enviar uma das fotos."); } }
  if (msg) msg.textContent = lista.length ? "Envio concluído. Escreva a legenda de cada ação técnica." : ""; renderStep(); renderRail();
}

function linhasPGR(){
  const L = Object.values(S.aeps)
    .filter(a => S.expEscopo === "todas" || a.status === "concluida")
    .filter(a => !S.expGHE || String(a.meta?.eg||"") === S.expGHE)
    .sort((x,y) => String(x.meta?.eg||"").localeCompare(String(y.meta?.eg||"")) || idNum(x) - idNum(y));
  const out = [];
  L.forEach(a => (a.perigos||[]).forEach(h => {
    const t = TAXMAP[h.codigo]; if (!t) return;
    // Colunas de graduação (Categoria Risco, Probabilidade, Severidade, Nível, Categoria, Ações) saem em
    // branco: são preenchidas à mão na planilha de controle.
    out.push([a.meta?.eg||"", (a.meta?.cargo||"").trim(), `${a.numero} / ${h.idRisco||"R??"}`, "Ergonomico", t.nome, h.fonte||"", "NA", "NA", t.danos||h.danos||"", h.tipoExp||"", h.tecnica||"",
      "NA","NA","NA","NA","NA", "", h.controles||"", h.poadEficaz||"", "NA","NA", "", "", "", "", ""]);
  }));
  return out;
}
let xlsxCarregando = null;
function carregarXLSX(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxCarregando) xlsxCarregando = new Promise((ok, no) => {
    const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    sc.onload = () => window.XLSX ? ok(window.XLSX) : no(new Error("xlsx")); sc.onerror = () => { xlsxCarregando = null; no(new Error("xlsx")); };
    document.head.appendChild(sc);
  });
  return xlsxCarregando;
}
async function exportarPGR(){
  if (!S.downloads) return;
  const linhas = linhasPGR(); if (!linhas.length) return;
  const btn = $("#btnExp"); if (btn){ btn.disabled = true; btn.textContent = "Gerando…"; }
  try {
    const X = await carregarXLSX();
    const ws = X.utils.aoa_to_sheet([PGR_COLS, ...linhas]);
    ws["!cols"] = [12,28,16,12,40,60,10,10,45,20,26,10,8,8,8,8,18,45,10,6,6,20,34,8,18,40].map(w => ({ wch: w }));
    ws["!autofilter"] = { ref: X.utils.encode_range({ s:{r:0,c:0}, e:{r:linhas.length, c:PGR_COLS.length-1} }) };
    const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, "EXPORTA PGR");
    const buf = X.write(wb, { bookType: "xlsx", type: "array" });
    const hoje = new Date().toLocaleDateString("pt-BR").replace(/\//g,"-");
    await S.downloads.save({ filename: `Exporta PGR - AEP 2026${S.expGHE ? " - GHE " + nomeArquivo(S.expGHE) : ""} - ${hoje}.xlsx`, data: buf });
    toast(`${linhas.length} linha(s) exportada(s).`);
  } catch(e){
    if (e && e.code === "declined") {}
    else if (e && e.message === "xlsx") toast("Não foi possível carregar o gerador de Excel. Verifique a internet e tente de novo.");
    else toast(e && e.code === "rate_limited" ? "Aguarde um instante e tente de novo." : "Não foi possível gerar o Excel.");
  } finally { const b = $("#btnExp"); if (b){ b.disabled = false; b.textContent = "Baixar Excel"; } }
}

function campo(e, isChange){
  const el = e.target; if (!el || !el.dataset) return;
  if (el.id === "fileFotos"){ if (isChange) { enviarFotos(el.files); el.value = ""; } return; }
  if (el.dataset.filtro){
    if (el.tagName === "SELECT" && !isChange) return;
    if (el.tagName !== "SELECT" && isChange) return;
    S[el.dataset.filtro] = el.value; atualizarHome(); return;
  }
  if (el.dataset.exp){ if (!isChange) return; S[el.dataset.exp] = el.value; const ex = $("#exportbox"); if (ex) ex.innerHTML = vExportPanel(); return; }
  if (el.dataset.hzBusca !== undefined){ S.hzFiltro = el.value; atualizarSelectTax(); return; }
  if (el.dataset.hzCat !== undefined){ if (isChange){ S.hzCat = el.value; atualizarSelectTax(); } return; }
  if (el.dataset.colar !== undefined){ S.colar = el.value; return; }
  if (el.dataset.gat !== undefined){
    if (!isChange) return;
    const g = new Set(S.draft.aet.gatilhos||[]); el.checked ? g.add(el.dataset.gat) : g.delete(el.dataset.gat);
    S.draft.aet.gatilhos = Array.from(g).sort(); marcar(); renderRail(); renderAside(); return;
  }
  const b = el.dataset.b; if (!b) return;
  const discreto = el.type === "radio" || el.type === "checkbox" || el.tagName === "SELECT";
  if (discreto && !isChange) return;
  // Campo de texto: o valor já foi tratado a cada tecla ("input"). O "change"
  // chega ao sair do campo — muitas vezes no meio de um clique em outro botão;
  // redesenhar a tela nesse instante faria o clique se perder.
  if (!discreto && isChange && el.type !== "date") return;
  const v = el.type === "checkbox" ? el.checked : el.value;
  if (b.startsWith("editArea.")) { setPath(S, b, v); onAreaChange(b, el); return; }
  setPath(rootOf(b), b, v);
  if (b.startsWith("editHz.")) { onHzChange(b, el); return; }
  if (b.startsWith("cfgDraft.")) { setSaveState("Alterações não salvas"); clearTimeout(S.cfgTimer); S.cfgTimer = setTimeout(salvarConfig, 700); return; }
  if (b === "meta.setor" || b === "meta.area"){
    const auto = setorPeloDepara(S.draft.meta.setor, S.draft.meta.area);
    if (auto && auto !== S.draft.meta.setorCopsoq){ S.draft.meta.setorCopsoq = auto; S.draft.copsoq.snapshot = snapDe(setorPorNome(auto)); renderBanner(); }
    const box = $("#setorcop"); if (box && !box.contains(document.activeElement)) box.innerHTML = vSetorCop();
  }
  if (b === "meta.setorCopsoq"){ S.draft.copsoq.snapshot = snapDe(setorPorNome(v)); renderBanner(); }
  marcar();
  if (el.dataset.rr) renderStep();
  renderRail(); renderAside();
  if (b === "meta.cargo" || b === "numero") renderTitulo();
}

    case "rmEscSim": a.escuta = a.escuta.filter(x => x.id !== d.id); S.confirm = null; marcar(); renderStep(); renderRail(); renderAside(); break;
    case "hzDoItem": {
      const n = Number(d.n), cod = (CK_PERIGOS[n]||[])[0] || "", tx = TAXMAP[cod], obs = a.checklist[n-1]?.obs;
      abrirHz({ _novo:true, checkItem: n, codigo: cod, danos: tx ? tx.danos : "", fonte: obs || "" });
      S.hzCat = ""; aposHz();
      if ((CK_PERIGOS[n]||[]).length > 1) toast(`O item ${n} aciona ${CK_PERIGOS[n].join(", ")}. Confira se o perigo sugerido é o certo.`);
      break;
    }
    case "hzDoCopsoq": {
      const s = SUBMAP[d.sub], snap = copsoqDaAEP(a), tx = TAXMAP[s.tax]; if (!tx) break;
      const med = snap?.medias?.[s.id], f = faixaDe(med) || "int";
      abrirHz({ _novo:true, codigo: tx.codigo, origemCopsoq: s.id, danos: tx.danos,
        fonte: `Sinal de triagem COPSOQ na subescala “${s.nome}” (média ${num2(med)}, ${FAIXAS[f]}, setor ${snap?.nome||"—"}). Fonte geradora a confirmar e redigir em campo: o resultado indica onde olhar, não caracteriza o posto.` });
      S.hzCat = ""; aposHz();
      toast("Perigo pré-preenchido. Confirme em campo, ajuste a fonte geradora e salve."); break;
    }
    case "novoHz": abrirHz({ _novo:true }); renderStep(); break;
    case "edHz": { const h = a.perigos.find(x => x.id === d.id); if (h) { abrirHz(clone(h)); renderStep(); window.scrollTo({top:0}); } break; }
    case "rmHz": S.confirm = "hz-" + d.id; renderStep(); break;
    case "rmHzSim": a.perigos = a.perigos.filter(x => x.id !== d.id); S.confirm = null; marcar(); renderStep(); renderRail(); renderAside(); break;
    case "salvarHz": salvarHz(); break;
    case "cancelarHz": S.editHz = null; S.hzErr = ""; renderStep(); break;
    case "usarFormula": { const tx = TAXMAP[S.editHz?.codigo]; if (!tx) break; S.editHz.fonte = tx.fonte; const ta = document.getElementById("f-editHz.fonte"); if (ta){ ta.value = tx.fonte; ta.focus(); } toast("Fórmula copiada: troque os termos genéricos pela condição real deste cargo."); break; }
    case "txtPadrao": { const dm = DOMINIOS.find(x => x.id === d.dom); a.copsoq.dominios[d.dom].obs = dm.padrao; marcar(); const ta = $("#f-obs-"+d.dom); if (ta) ta.value = dm.padrao; renderRail(); renderAside(); break; }
    case "txtModelo": {
      const dd = a.copsoq.dominios[d.dom], novo = textoModelo(a, d.dom, d.tipo), atual = (dd.obs||"").trim();
      const intocado = !atual || MODELOS_OBS.some(m => textoModelo(a, d.dom, m.id) === atual);
      dd.obs = intocado ? novo : atual + "\n\n" + novo;
      dd.concl = CONCLUSOES[MODELOS_OBS.find(m => m.id === d.tipo).concl];
      marcar(); renderStep(); renderRail(); renderAside();
      if (!intocado) toast("Seu texto foi mantido e o modelo entrou no final: revise e apague o que não se aplica.");
      break;
    }
    case "usarSug": { const r = resultadoDominio(a, d.dom); a.copsoq.dominios[d.dom].concl = conclusaoSugerida(r); marcar(); renderStep(); renderRail(); renderAside(); break; }
    case "atualizarSnap": { const set = S.areas[a.copsoq.snapshot?.setorId] || setorPorNome(a.meta.setorCopsoq); a.copsoq.snapshot = snapDe(set); marcar(); renderBanner(); renderStep(); renderRail(); renderAside(); toast("Notas do setor atualizadas nesta AEP."); break; }
    case "ftUp": case "ftDown": { const i = Number(d.i), j = d.act === "ftUp" ? i-1 : i+1, F = a.fotos; [F[i],F[j]] = [F[j],F[i]]; marcar(); renderStep(); break; }
    case "rmFt": S.confirm = "ft-" + d.id; renderStep(); break;
    case "rmFtSim": {
      const f = a.fotos.find(x => x.id === d.id);
      a.fotos = a.fotos.filter(x => x.id !== d.id); S.confirm = null; marcar(); await salvarAEP();
      if (f && S.assets) { try { await S.assets.delete(f.assetId); } catch(_){} }
      renderStep(); renderRail(); break;
    }
    case "novaArea": S.editArea = completarArea(null); S.areaDirty = false; S.colar = ""; S.colarMsg = ""; render(); break;
    case "voltarAreas": await salvarArea(); S.editArea = null; S.confirm = null; render(); break;
    case "delArea": S.confirm = "delArea"; render(); break;
    case "delAreaSim": {
      const id = S.editArea.id; clearTimeout(S.areaTimer); S.areaDirty = false;
      if (S.db) { try { await S.db.doc("copsoq/" + id).delete(); } catch(_){ toast("Não foi possível excluir."); return; } }
      delete S.areas[id]; S.editArea = null; S.confirm = null; render(); toast("Setor excluído."); break;
    }
    case "colar": importarColagem(); break;
  }
});
function rerender(){
  if (S.view === "aep"){ renderTitulo(); renderStep(); }
  else render();
}

/* Salva antes de sair da página */
window.addEventListener("pagehide", () => { salvarAEP(); salvarArea(); });

</script>
<script>
/* =========================================================================
   PONTE SUPABASE — substitui o banco, as fotos e os downloads do Artifact.
   O resto do sistema chama window.claude.use("db" | "assets" | "downloads")
   exatamente como antes.
   ========================================================================= */
const SUPA_URL = "https://ewtbcwubdlxaybaqiqzx.supabase.co";
const SUPA_KEY = "sb_publishable_XCL2AkQyHHA6-F-Pu5ERgA_3WSZFqpY";
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);
const BUCKET = "fotos";

async function lerTudo(col){
  let out = [], from = 0;
  for (;;){
    const { data, error } = await sb.from(col).select("id,data").range(from, from + 999);
    if (error) throw error;
    out = out.concat(data || []);
    if (!data || data.length < 1000) break;
    from += 1000;
  }
  return out;
}
const docSnap = (id, data) => ({ id, exists: data != null, data: () => data });
const dbShim = {
  collection(col){
    return { onSnapshot(cb, err){
      lerTudo(col).then(rows => cb({ docs: rows.map(r => docSnap(r.id, r.data)) })).catch(e => { console.error(e); err && err(e); });
      return () => {};
    } };
  },
  doc(path){
    const [col, id] = path.split("/");
    return {
      async set(obj){
        const { error } = await sb.from(col).upsert({ id, data: obj, updated_at: new Date().toISOString() });
        if (error) throw error;
      },
      async delete(){
        const { error } = await sb.from(col).delete().eq("id", id);
        if (error) throw error;
      },
      onSnapshot(cb, err){
        sb.from(col).select("data").eq("id", id).maybeSingle()
          .then(({ data, error }) => { if (error) throw error; cb(docSnap(id, data ? data.data : null)); })
          .catch(e => { console.error(e); err && err(e); });
        return () => {};
      }
    };
  }
};
const novoIdFoto = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join("");
const assetsShim = {
  async upload(blob, opt = {}){
    const id = novoIdFoto();
    const { error } = await sb.storage.from(BUCKET).upload(id + ".jpg", blob, { contentType: opt.type || "image/jpeg", upsert: false });
    if (error) throw error;
    return { id };
  },
  async delete(id){
    const { error } = await sb.storage.from(BUCKET).remove([id + ".jpg"]);
    if (error) throw error;
    FOTO_URL.delete(id);
  }
};
const downloadsShim = {
  async save({ filename, data }){
    const blob = data instanceof Blob ? data : new Blob([data], { type: typeof data === "string" ? "text/html;charset=utf-8" : "application/octet-stream" });
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = filename; a.style.display = "none"; document.body.appendChild(a); a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 4000);
  }
};
window.claude = { use: async n => ({ db: dbShim, assets: assetsShim, downloads: downloadsShim })[n] || null };

/* ---------- Fotos: o bucket é privado; cada <img data-foto="id"> recebe um link temporário ---------- */
const FOTO_URL = new Map();
let fotoPend = new Set(), fotoTimer = null;
async function buscarFotos(){
  const ids = [...fotoPend]; fotoPend = new Set();
  for (let i = 0; i < ids.length; i += 100){
    const lote = ids.slice(i, i + 100);
    const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(lote.map(x => x + ".jpg"), 12 * 3600);
    if (error) { console.error(error); continue; }
    (data || []).forEach(r => { if (r.signedUrl) FOTO_URL.set(String(r.path).replace(/\.jpg$/, ""), r.signedUrl); });
  }
  aplicarFotos();
}
function aplicarFotos(){
  let falta = false;
  document.querySelectorAll("img[data-foto]").forEach(img => {
    const id = img.dataset.foto, u = FOTO_URL.get(id);
    if (u) { if (img.getAttribute("src") !== u) img.src = u; }
    else if (id) { fotoPend.add(id); falta = true; }
  });
  if (falta) { clearTimeout(fotoTimer); fotoTimer = setTimeout(buscarFotos, 40); }
}
async function urlsFotos(ids){
  const falta = ids.filter(i => !FOTO_URL.has(i));
  if (falta.length) { falta.forEach(i => fotoPend.add(i)); await buscarFotos(); }
  return ids.map(i => FOTO_URL.get(i) || "");
}
new MutationObserver(aplicarFotos).observe(document.body, { childList: true, subtree: true });

const blobParaDataURL = b => new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = no; fr.readAsDataURL(b); });
async function paraDataURL(assetId){
  try { const { data, error } = await sb.storage.from(BUCKET).download(assetId + ".jpg"); if (error) throw error; return await blobParaDataURL(data); }
  catch(e){ return ""; }
}
async function logoDataURL(){
  try { const r = await fetch("logo.png"); if (!r.ok) throw 0; return await blobParaDataURL(await r.blob()); } catch(e){ return ""; }
}

/* ---------- Login ---------- */
async function entrar(){
  const { data } = await sb.auth.getSession();
  if (data && data.session) { document.getElementById("login").hidden = true; iniciar(); return; }
  document.getElementById("login").hidden = false;
  document.getElementById("login-email").focus();
}
document.getElementById("login-form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = document.getElementById("login-btn"), msg = document.getElementById("login-msg");
  btn.disabled = true; msg.textContent = "Entrando…";
  const { error } = await sb.auth.signInWithPassword({ email: document.getElementById("login-email").value.trim(), password: document.getElementById("login-senha").value });
  btn.disabled = false;
  if (error) { msg.textContent = /invalid/i.test(error.message) ? "E-mail ou senha incorretos." : "Não foi possível entrar: " + error.message; return; }
  msg.textContent = ""; document.getElementById("login").hidden = true; iniciar();
});
document.getElementById("btn-sair").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });

entrar();
</script>
