<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="logo.png">
<style>[hidden]:not([hidden=until-found i]){display:none!important}img{max-width:100%}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<title>AEP · Mina de Serra Azul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
:root{
  --paper:#F4F4F3; --surface:#FFFFFF; --surface-2:#F8F8F7;
  --ink:#232323; --ink-2:#4F4F4F; --ink-3:#767676;
  --rule:#E0DFDD; --rule-strong:#BEBCB9;
  --brand:#EA5B26; --brand-ink:#414141;
  --accent:#C2451A; --accent-ink:#FFFFFF; --accent-soft:#FDF2EC; --accent-line:#F1B89F;
  --warn-bg:#FFF6E0; --warn-ink:#7A5200; --warn-line:#EBCB7C;
  --bad-bg:#FCEBEA; --bad-ink:#8E1C1C; --bad-line:#E9A9A5;
  --ok-bg:#E8F4EC; --ok-ink:#1E6B3E; --ok-line:#A5D2B5;
  --dot-ok:#2E7D4F; --dot-pend:#D9A21B; --crit:#A51C1C;
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#141414; --surface:#1D1D1D; --surface-2:#242424;
    --ink:#ECECEC; --ink-2:#B9B9B9; --ink-3:#8A8A8A;
    --rule:#313131; --rule-strong:#474747;
    --brand:#F07A4C; --brand-ink:#ECECEC;
    --accent:#F4885C; --accent-ink:#1A0C05; --accent-soft:#3A2218; --accent-line:#7A3D22;
    --crit:#D2453F;
    --warn-bg:#2E2510; --warn-ink:#F0CF84; --warn-line:#5E4A1C;
    --bad-bg:#321717; --bad-ink:#F2A9A4; --bad-line:#6A2A28;
    --ok-bg:#132A1D; --ok-ink:#9FD9B4; --ok-line:#2C5A3D;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#141414; --surface:#1D1D1D; --surface-2:#242424;
  --ink:#ECECEC; --ink-2:#B9B9B9; --ink-3:#8A8A8A;
  --rule:#313131; --rule-strong:#474747;
  --brand:#F07A4C; --brand-ink:#ECECEC;
  --accent:#F4885C; --accent-ink:#1A0C05; --accent-soft:#3A2218; --accent-line:#7A3D22;
  --crit:#D2453F;
  --warn-bg:#2E2510; --warn-ink:#F0CF84; --warn-line:#5E4A1C;
  --bad-bg:#321717; --bad-ink:#F2A9A4; --bad-line:#6A2A28;
  --ok-bg:#132A1D; --ok-ink:#9FD9B4; --ok-line:#2C5A3D;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-cond);font-weight:600;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:.005em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-cond);font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}

/* ---------- Topo ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--rule);box-shadow:inset 0 3px 0 var(--brand)}
.topbar-in{max-width:1400px;margin:0 auto;padding-inline:16px;padding-top:3px;display:flex;align-items:center;gap:20px;min-height:60px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;padding-block:8px;min-width:0}
.brand-logo{display:flex;align-items:center;padding-right:14px;border-right:1px solid var(--rule)}
.brand-logo img{height:30px;width:auto;display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand-logo img{background:#fff;padding:3px 6px;border-radius:4px;height:32px}}
:root[data-theme="dark"] .brand-logo img{background:#fff;padding:3px 6px;border-radius:4px;height:32px}
.login{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:16px}
.login form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--rule);border-top:3px solid var(--brand);border-radius:var(--radius);padding:26px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.login img{height:36px;width:auto;align-self:flex-start}
.login h1{font-size:20px}
.login .msg{font-size:12.5px;color:var(--bad-ink);min-height:1.2em}
.brand-txt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-txt b{font-family:var(--f-cond);font-size:18px;font-weight:700;letter-spacing:.04em;color:var(--brand-ink)}
.brand-txt span{font-size:11.5px;color:var(--ink-3)}
@media (max-width:560px){.brand-txt span{display:none}}
.nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.nav button{background:none;border:0;padding:8px 12px;border-radius:var(--radius);cursor:pointer;color:var(--ink-2);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft);font-weight:600}
.savestate{font-size:12px;color:var(--ink-3);min-width:90px;text-align:right}
.nav button{display:inline-flex;align-items:center;gap:8px}
.nav .ni{width:18px;height:18px;flex:none;opacity:.85}
@media (max-width:1099px){.nav .ni{display:none}}
@media screen and (min-width:1100px){
  body{padding-left:236px}
  .topbar{position:fixed;left:0;top:0;bottom:0;width:236px;border-bottom:0;border-right:1px solid var(--rule);box-shadow:inset 3px 0 0 var(--brand);overflow-y:auto}
  .topbar-in{flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:12px;min-height:100%;padding:18px 14px 16px 18px;max-width:none}
  .brand{flex-direction:column;align-items:flex-start;gap:10px;padding:0 4px 14px;border-bottom:1px solid var(--rule)}
  .brand-txt span{display:block;white-space:normal}
  .nav{flex-direction:column;flex-wrap:nowrap;margin-left:0;gap:2px}
  .nav button{width:100%;padding:10px 12px;font-size:14.5px;text-align:left}
  .nav button[aria-current="page"]{box-shadow:inset 3px 0 0 var(--accent)}
  .savestate{margin-top:auto;text-align:left;min-width:0}
  #btn-sair{align-self:flex-start}
  .brand-logo{border-right:0;padding-right:0}
}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.seg button b{font-variant-numeric:tabular-nums;margin-left:4px;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:600}
.seg button[aria-pressed="true"] b{color:var(--accent)}

.wrap{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:22px 60px}

/* ---------- Controles ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule-strong);background:var(--surface);padding:8px 14px;border-radius:var(--radius);cursor:pointer;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn:not(.primary):not(.ghost):not(.danger):hover{color:var(--accent);border-color:var(--accent-line)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding-inline:8px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--bad-ink);border-color:var(--bad-line)}
.btn.small{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:5px;min-width:0}
label.f > span:not(.hint):not(.dica),div.f > span:first-child{font-size:12px;font-weight:600;color:var(--ink-2)}
div.f{display:flex;flex-direction:column;gap:5px;min-width:0}
div.f > span em{font-style:normal;color:var(--bad-ink)}
div.f > .seg{align-self:flex-start;max-width:100%;flex-wrap:wrap}
label.f > span em{font-style:normal;color:var(--bad-ink)}
.hint{font-size:11.5px;color:var(--ink-3);line-height:1.45}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],select,textarea{width:100%;background:var(--surface);border:1px solid var(--rule-strong);border-radius:var(--radius);padding:8px 10px;min-width:0}
textarea{resize:vertical;min-height:72px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.spanall{grid-column:1/-1}
@media (max-width:760px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.span2,.span3{grid-column:auto}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
label.row > input[type=checkbox]{flex:none}
label.row > input[type=checkbox] + span{flex:1 1 0;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.stack.tight{gap:8px}

/* ---------- Superfícies ---------- */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.panel-h{padding:13px 18px;border-bottom:1px solid var(--rule);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.panel-b{padding:18px}
.note{border:1px solid var(--rule);background:var(--surface-2);border-radius:var(--radius);padding:10px 12px;font-size:12.5px;color:var(--ink-2)}
.note.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.note.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad-ink)}
.note.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-ink)}
.note b{font-weight:600}

/* ---------- Chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--rule-strong);color:var(--ink-2);background:var(--surface);white-space:nowrap}
.chip.fav{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok-ink)}
.chip.int{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn-ink)}
.chip.ris{border-color:var(--bad-line);background:var(--bad-bg);color:var(--bad-ink)}
.chip.draft{border-color:var(--warn-line);color:var(--warn-ink);background:var(--warn-bg)}
.chip.done{border-color:var(--ok-line);color:var(--ok-ink);background:var(--ok-bg)}
.code{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--accent)}

/* ---------- Lista de AEPs ---------- */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{font-size:28px;font-weight:700;padding-left:12px;border-left:4px solid var(--brand)}
.pagehead p{margin-top:4px;color:var(--ink-2);max-width:68ch}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:18px}
.stat{padding-left:12px;border-left:2px solid var(--rule)}
.stat b{display:block;font-family:var(--f-cond);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--ink-3)}
.tablewrap{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;min-width:760px}
table.list th{text-align:left;font-family:var(--f-cond);font-weight:600;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--surface-2)}
table.list td{padding:12px 14px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:var(--surface-2)}
table.list tr:last-child td{border-bottom:0}
.empty{padding:38px 18px;text-align:center;color:var(--ink-2)}

/* ---------- Editor da AEP ---------- */
.editor{display:grid;grid-template-columns:230px minmax(0,1fr) 290px;gap:20px;align-items:start}
@media (max-width:1180px){.editor{grid-template-columns:210px minmax(0,1fr)}.aside{grid-column:1/-1}}
@media (max-width:760px){.editor{grid-template-columns:minmax(0,1fr)}}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.rail button{width:100%;display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;text-align:left;background:none;border:0;border-left:2px solid transparent;padding:8px 10px;cursor:pointer;color:var(--ink-2);border-radius:0 var(--radius) var(--radius) 0}
.rail button:hover{background:var(--surface);color:var(--ink)}
.rail button[aria-current="step"]{border-left-color:var(--brand);background:var(--surface);color:var(--ink);font-weight:600}
.rail button[aria-current="step"] .n{color:var(--accent)}
.rail .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.rail .dot{width:8px;height:8px;border-radius:50%;background:var(--rule-strong)}
.rail .dot.ok{background:var(--dot-ok)}
.rail .dot.pend{background:var(--dot-pend)}
@media (max-width:760px){
  .rail{position:static}
  .rail ol{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .rail li{flex:0 0 auto}
  .rail button{grid-template-columns:auto auto auto;border-left:0;border-bottom:2px solid transparent;border-radius:var(--radius) var(--radius) 0 0}
  .rail button[aria-current="step"]{border-bottom-color:var(--accent)}
  .rail .lbl{white-space:nowrap}
}
.stephead{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.stephead h2{font-size:23px;font-weight:700}
.stephead p{color:var(--ink-2);max-width:72ch}
.stepnav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.aeptitle{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.aeptitle h1{font-size:24px;font-weight:700}
.aside .panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (max-width:1180px){.aside .panel{position:static}}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpis > div{border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface-2);padding:8px 10px}
.kpis b{display:block;font-family:var(--f-cond);font-size:24px;font-weight:700;line-height:1.1;color:var(--ink)}
.kpis span{font-size:11.5px;color:var(--ink-3);line-height:1.3}
.pendlist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2)}

/* ---------- Checklist / tabelas de formulário ---------- */
.ckl{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
.ck{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;padding:12px 14px;border-bottom:1px solid var(--rule);background:var(--surface)}
.ck:last-child{border-bottom:0}
.ck.sim{background:var(--bad-bg)}
.ck .i{font-family:var(--f-mono);font-weight:600;color:var(--ink-3);padding-top:2px}
.ck p{font-size:13px}
@media (max-width:760px){.ck{grid-template-columns:30px minmax(0,1fr)}.ck .seg{grid-column:2}}
.msel{position:relative;min-width:0}
.msel>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:38px;padding:7px 12px;border:1px solid var(--rule-strong);border-radius:var(--radius);background:var(--surface);color:var(--ink);font-size:14px;font-weight:400;max-width:100%}
.msel>summary::-webkit-details-marker{display:none}
.msel>summary span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.msel>summary::after{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg) translateY(-2px)}
.msel[open]>summary{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#f-gerdet .msel-pop{left:auto;right:0}
.msel-pop{position:absolute;z-index:30;top:calc(100% + 6px);left:0;min-width:100%;width:max-content;max-width:min(420px,calc(100vw - 32px));max-height:min(380px,60vh);overflow:auto;background:var(--surface);border:1px solid var(--rule-strong);border-radius:var(--radius);box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px}
@media (max-width:640px){.msel-pop{position:fixed;left:16px!important;right:16px!important;top:auto;width:auto;min-width:0;max-width:none;margin-top:6px}}
.msel-top{display:flex;justify-content:space-between;gap:8px;padding:2px 4px 6px;border-bottom:1px solid var(--rule);margin-bottom:4px}
.msel-pop label{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:400;color:var(--ink)}
.msel-pop label:hover{background:var(--surface-2)}
.msel-pop label input{accent-color:var(--accent);margin:0;width:18px;height:18px;flex:none}
.msel-pop label span{flex:1}
.msel-pop label b{font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:12px}
.msel-pop label:has(input:checked){background:var(--accent-soft)}
.recm{border:1px solid var(--rule);border-radius:var(--radius);padding:10px 12px;background:var(--surface-2)}
.recm-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:8px}
.recm-h b{font-size:13px}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchip{border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;min-height:34px}
.rchip.lig{border-color:var(--accent-line);color:var(--ink);font-weight:600}
.rchip.lig::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.rchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rchip[aria-pressed="true"]::before{background:var(--accent-ink)}
.rlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--rule-strong)}
.rpill{border:1px dashed var(--accent-line);background:var(--surface);color:var(--ink);border-radius:var(--radius);padding:6px 10px;font-size:13px;cursor:pointer;min-height:34px}
.rpill:hover{background:var(--accent-soft);border-style:solid}
.rpill.ok{border:1px solid transparent;background:transparent;color:var(--ink-3);cursor:default}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.ccard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px 16px;min-height:96px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.ccard:hover,.ccard:focus-visible{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.ccard b{font-size:15px;line-height:1.3}
.campo{display:flex;flex-direction:column;gap:14px}
.cstep{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--rule)}
.cstep h2{font-size:16px;margin:0}
.cn{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--surface-2);border:1px solid var(--rule-strong);color:var(--ink-2)}
.cn.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-ink)}

<script>
/* Documento de critérios do GRO e mapa de polaridade (vindos da planilha CONTROLE GERAL AEP 2026, 23/10/2026) */
const CRITERIOS_DOC = [["h1","CRITÉRIOS ADOTADOS NO GERENCIAMENTO DE RISCOS (GRO)"],["p","Documento exigido pelo item 2 das Perguntas e Respostas GRO/PGR (MTE, 2026): critérios das gradações de severidade e de probabilidade, níveis de risco, critérios de classificação de riscos e de tomada de decisão. ANEXO DO PROCEDIMENTO: alterar somente com controle de versão."],["p","A Seção 1 descreve o que entra no inventário e como: o registro por domínio do COPSOQ II, vigente em todos os GHE, e o perigo nominado após a AEP do cargo. A Seção 2 descreve como o risco é graduado."],["h2","SEÇÃO 1 - REGISTRO NO INVENTÁRIO: O QUE ENTRA E COMO"],["p","PRINCÍPIO: risco trivial ou tolerável não é risco zero e permanece no inventário, com as medidas que o mantêm nesse nível. O registro por domínio do COPSOQ II vale para todos os GHE desde já; a AEP do cargo confirma, detalha ou indica a revisão desse registro. Perigo de exigência presente no trabalho real, com duração relevante, entra mesmo controlado, no menor nível que a matriz permitir. Perigo de deficiência só entra quando a deficiência é constatada; condição avaliada e adequada fica registrada na AEP como conforme. Sai do inventário apenas o fator não aplicável, com justificativa."],["table",[["Situação","Quando se aplica","O que fazer","Entra no inventário?","Como fica a linha","Fundamento normativo"],["Registro por domínio","Todos os GHE. Uma linha por domínio do COPSOQ II, com o resultado do setor ao qual o GHE pertence.","Lançar conforme o Relatório Técnico FRPT (Seção 6) e a planilha de lançamento do PGR, que guarda a memória de cálculo. O sistema não recalcula essas linhas.","SIM: vigente","Domínio + fonte (subescala crítica e escore) + agravos + medidas + P x S + nível e ação. Revisto no censo seguinte, no máximo a cada 2 anos.","NR-1, 1.5.4.4.5.3, 1.5.4.4.6 e 1.5.7.3.2."],["Perigo de exigência (após a AEP)","AEP concluída. A exigência está presente no trabalho real, com duração relevante. Ex.: postura mantida, repetitividade, demanda cognitiva ou emocional.","Lançar o perigo da Taxonomia com fonte geradora do cargo, Probabilidade por Exigência x Eficácia (2.3 e 2.4) e severidade-âncora (2.8).","SIM: mesmo controlado","Perigo + fonte do cargo + medidas + P x S, no menor nível que a matriz permitir. Encaminhamento conforme o nível (2.2).","NR-1, 1.5.4.4.5.3 e 1.5.7.3.2; NR-17, 17.3.1 e 17.3.8."],["Perigo de deficiência (após a AEP)","AEP concluída. Condição inadequada constatada em campo, no checklist ou em medição. Ex.: mobiliário sem ajuste, iluminação inadequada, pausas insuficientes.","Lançar o perigo com a deficiência constatada, as medidas existentes e a ação no Plano de ação quando o nível exigir.","SIM","Perigo + fonte específica + P x S + medidas + evidência.","NR-17; NR-1, 1.5.4.4.5.1 e 1.5.4.4.5.3."],["Condição avaliada e conforme","AEP concluída. A condição foi verificada e está adequada.","Registrar na AEP o que foi verificado.","NÃO","Sem linha. Consta na AEP como avaliada e conforme e integra o PGR pela AEP.","NR-1, 1.5.7.3.2, alínea h; NR-17, 17.3.5."],["Fator não aplicável (NA)","A condição não existe no cargo. Ex.: trabalho noturno em função exclusivamente diurna.","Registrar a justificativa técnica na AEP, com o que foi verificado.","NÃO","Sem linha. Justificativa registrada na AEP.","Perguntas e Respostas GRO/PGR (MTE, 2026), nº 19."]]],["h3","ATÉ A AEP DO CARGO"],["p","Vale o registro por domínio do Relatório Técnico FRPT, lançado conforme a planilha de lançamento do PGR. O sistema não cria linha provisória."],["p","A ordem das AEPs segue o cronograma. O resultado do COPSOQ II do setor orienta o que verificar em campo no cargo."],["p","Concluída a AEP, ela confirma o enquadramento do domínio no trabalho real. Havendo fonte específica no cargo, o perigo da Taxonomia é lançado na AEP e classificado no Inventário. Se encontrar condição não refletida no enquadramento ou medida ineficaz, a linha do domínio é reavaliada na planilha de lançamento, com data."],["p","Fundamento: NR-1, 1.5.4.4.6, a avaliação de riscos é processo contínuo e é revista nas situações previstas no item."],["h3","EXIGÊNCIA INERENTE À ATIVIDADE (OT-05 e OT-12)"],["p","Exigências cognitivas e Exigências emocionais medem a DEMANDA que a atividade impõe, não a sobrecarga. Demanda elevada é característica esperada de funções de operação, monitoramento, decisão e atendimento, e não constitui, por si, condição adversa."],["p","Por isso, resultado acima de 3,66 nestas duas subescalas orienta a AEP. A caracterização como fator de risco organizacional depende da verificação, em campo, de que os recursos de regulação e o suporte disponíveis são insuficientes para a demanda observada. Presente a exigência, o perigo é lançado como perigo de exigência, no menor nível que a matriz permitir quando as medidas são eficazes."],["p","Fundamento: NR-1, subitem 1.5.4.4.5.3, a avaliação considera as exigências da atividade de trabalho E a eficácia das medidas de prevenção implementadas. Exigência alta com medida eficaz não é risco não controlado. A marcação de quais perigos são de exigência inerente está na TAXONOMIA."],["p","Aplica-se somente a OT-05 e OT-12."],["h3","AMOSTRA MÍNIMA"],["p","Não há número mínimo de respondentes fixado em norma; o critério que prevalece é a preservação da confidencialidade dos respondentes. A unidade divulga resultados somente para grupos com no mínimo 5 respondentes; grupos abaixo desse mínimo são agrupados com setor afim (Perguntas e Respostas GRO/PGR 2026, nº 11)."],["p","O nº de respondentes por setor está na tela COPSOQ por setor. Em setores com poucos respondentes, a AEP dá peso maior à observação das condições de trabalho, à análise da atividade e ao diálogo com os trabalhadores, sem desconsiderar o resultado do censo."],["h3","REGRAS FIXAS"],["p","1. Os 6 domínios do COPSOQ II são registrados no inventário por setor, em cada GHE, conforme o Relatório Técnico FRPT. Na AEP, são os eixos de conclusão do bloco psicossocial. No cargo, o nome da subescala não é usado como nome de perigo."],["p","2. Violência e assédio: o domínio Comportamentos ofensivos permanece no inventário de todos os GHE, com severidade 4, e não admite NA. No cargo, OT-11 é lançado quando a AEP identifica fonte específica."],["p","3. Satisfação laboral é indicador de efeito, não perigo. Nunca gera linha isoladamente."],["p","4. Significado do trabalho e Compromisso são protetores. Se desfavoráveis, investigar OT-04, OT-06 ou OT-10."],["p","5. A compensação entre subescalas vale só no registro por domínio, nas condições do modelo Demanda-Controle-Suporte descritas no Relatório Técnico FRPT: reduz no máximo 1 nível, é revista no censo seguinte e não se aplica a comportamentos ofensivos. No cargo, o efeito das medidas entra pelo eixo Eficácia (2.3.2)."],["p","6. Risco trivial ou tolerável permanece no inventário, com as medidas que o mantêm nesse nível. Sai do inventário apenas o fator não aplicável, com justificativa."],["p","7. Havendo divergência entre o resultado do COPSOQ II e a observação em campo, nenhuma das fontes é descartada: a divergência é registrada na AEP e verificada com a escuta dos trabalhadores. Confirmada, a linha do domínio é reavaliada na planilha de lançamento, com data."],["p","8. Jornada, pausas e monotonia não são rastreados pelo COPSOQ: entram pelo eixo Organização do Trabalho, com origem declarada como campo e análise documental."],["p","9. Resultado desfavorável em subescala de exigência inerente (OT-05, OT-12) entra no registro por domínio e orienta a AEP; o perigo nominado no cargo depende da verificação em campo."],["h2","SEÇÃO 2 - GRADAÇÃO: COMO O RISCO É CLASSIFICADO"],["h3","2.1 Escalas oficiais"],["table",[["PROBABILIDADE","SEVERIDADE","REFERÊNCIA SEVERIDADE ERGONÔMICA"],["1 - Raro","1 - Lesão leve","Desconforto, fadiga, mal-estar ou alteração transitória do bem-estar físico ou psíquico"],["2 - Pouco Provável","2 - Lesão com incômodo / desconforto leve","Dor, desconforto, sofrimento ou alteração funcional temporária, físico ou psíquico"],["3 - Provável","3 - Lesão com restrição de alto potencial","Agravo ou lesão reversível à saúde física ou psíquica."],["4 - Muito Provável","4 - Lesão grave parcial de alto potencial","Agravo ou lesão grave com limitação funcional prolongada ou parcialmente irreversível  à saúde física ou psíquica."],["5 - Praticamente Certo","5 - Lesão grave permanente de alto potencial / Fatalidade","Agravo gravíssimo, incapacidade total e permanente para o trabalho ou desfecho fatal (óbito)"]]],["h3","2.2 Matriz Probabilidade x Severidade"],["gen","MATRIZ"],["p","A grade acima é gerada a partir da mesma regra que o sistema calcula no Inventário (Nível do Risco = Probabilidade x Severidade). Documento de critérios e cálculo são a mesma coisa: qualquer célula desta grade pode ser conferida contra o Inventário."],["h3","2.3 Origem da Probabilidade: Exigência da Atividade × Eficácia das Medidas"],["p","Base normativa: NR-1, subitem 1.5.4.4.5.3: para fatores ergonômicos, incluindo os fatores de riscos psicossociais relacionados ao trabalho, a avaliação da probabilidade deve considerar as exigências da atividade de trabalho e a eficácia das medidas de prevenção implementadas. A NR-1 não fixa escalas, faixas de tempo nem fórmula: tudo o que está nas tabelas desta seção é critério interno desta organização, documentado aqui (ver 2.7)."],["p","Referência técnica oficial: Manual de interpretação e aplicação do Capítulo 1.5 da NR-1 (MTE, 2026), item 11.4.2: considerar as exigências da atividade é verificar o que e o quanto é exigido do trabalhador, considerando a DURAÇÃO da exposição e a INTENSIDADE das exigências (frequência, esforço, gestos, posturas, pressão, entre outros)."],["p","Estrutura: dois eixos, como no subitem 1.5.4.4.5.3. Eixo A (Exigência da atividade (2.3.1), que já combina duração e intensidade numa única escala. Eixo B) Eficácia das medidas (2.3.2). O cruzamento dos dois dá a Probabilidade (2.4)."],["h3","2.3.1 Eixo A - Exigência da atividade (1 a 5)"],["p","Critérios de duração × intensidade da Tabela 2 (Gradações de probabilidade relacionada a fatores de risco ergonômicos) publicada na Revista da Escola Nacional da Inspeção do Trabalho, ano 9, 2025, p. 413 [ARTIGO: título e autores], adaptada pelos autores de Generalitat de Catalunya (2006), Firth et al. (2020) e Occhipinti & Colombini (2016). Nesta unidade a tabela é usada como escala de Exigência, e não diretamente como probabilidade, porque a NR-1 manda cruzar a exigência com a eficácia das medidas (2.3.2)."],["table",[["Exigência","Critério: duração da exposição × intensidade das exigências"],["5 - Extrema","Exigências em nível crítico de intensidade ou situação inaceitável na atividade de trabalho, em qualquer duração."],["4 - Alta","Exposição longa (mais de 4 h) com exigências de média ou alta intensidade; ou exposição média (2 h a 4 h) com exigências de alta intensidade."],["3 - Moderada","Exposição longa (mais de 4 h) com exigências de baixa intensidade; ou exposição média (2 h a 4 h) com exigências de média intensidade; ou exposição curta (menos de 2 h) com exigências de alta intensidade."],["2 - Leve","Exposição média (2 h a 4 h) com exigências de baixa intensidade; ou exposição curta (menos de 2 h) com exigências de média intensidade; ou exposição de 1 h a menos de 2 h com exigências de baixa intensidade."],["1 - Mínima","Exposição curtíssima (menos de 1 h) com exigências de baixa intensidade."]]],["gen","EXIGENCIA"],["p","Duração = tempo efetivo de exposição ao fator na jornada típica (soma dos períodos), obtido por observação, entrevista ou registro, com a fonte anotada na caracterização da exposição. Limites: curtíssima < 1 h; curta < 2 h; média de 2 h a 4 h; longa > 4 h. Exposição que não ocorre todos os dias: usa-se a duração nos dias em que ocorre e registra-se a frequência."],["p","Fatores de organização do trabalho e psicossociais, cuja exposição não se mede em horas por jornada (adaptação interna): curtíssima = ocorrência rara, menos de uma vez por mês; curta = eventual, menos de uma vez por semana; média = semanal ou em alguns dias da semana; longa = diária ou característica estrutural da organização do trabalho."],["h3","2.3.2 Eixo B - Eficácia das medidas de prevenção (1 a 5)"],["p","A Exigência registra a exposição como ela é no trabalho real, já com o efeito das medidas existentes sobre o tempo e a carga. A Eficácia avalia o quanto essas medidas são robustas e garantidas no tempo: posição na hierarquia de prevenção, evidência de implantação e manutenção sem desvios. Assim nenhuma medida é contada duas vezes: o efeito dela aparece na Exigência; a confiabilidade dela, na Eficácia."],["table",[["Nota","Critério"],["1 - Inexistente","Nenhuma medida de prevenção para o fator na situação avaliada."],["2 - Insuficiente","A medida existe, mas sem evidência de implantação na unidade avaliada, ou com desvios e falhas observados no trabalho real (existe só em documento, não é praticada, não é mantida)."],["3 - Parcial","Medida administrativa ou organizacional implantada e com evidência: pausas, rodízio, procedimento, treinamento, autonomia de ritmo. Depende do cumprimento pelas pessoas."],["4 - Eficaz","Medida de engenharia ou arranjo ergonômico implantado, com evidência de uso e manutenção: dispositivo auxiliar, mobiliário regulável, reprojeto do posto. Depende de uso ou ajuste pelo trabalhador."],["5 - Controle integrado","Controle incorporado ao processo, que não depende da ação do trabalhador (mecanização, automação, eliminação ou substituição da etapa), com manutenção verificada."]]],["p","REGRA 1: a nota exige evidência. Medida sem evidência registrada na unidade avaliada pontua no máximo Eficácia = 2, qualquer que seja o tipo. Programa corporativo genérico sem evidência no setor, ou medida implantada em área diversa da avaliada, não reduz risco."],["p","REGRA 2: havendo mais de uma medida para o mesmo perigo, vale a nota da medida de maior nível que tenha evidência. Medida de maior nível com desvio observado cai para 2."],["h3","2.4 Conversão em Probabilidade"],["p","Probabilidade = ARRED( (2 × Exigência + (6 − Eficácia)) ÷ 3 ; 0 ). A grade abaixo é calculada por essa fórmula, célula a célula, e é a mesma aplicada no Inventário do sistema."],["gen","GRADE"],["p","Efeitos da fórmula: a eficácia das medidas reduz a probabilidade mesmo com exigência elevada (Exigência 5 com Eficácia 5 resulta em Probabilidade 4, e não 5); e medidas eficazes, sozinhas, não anulam uma exigência extrema (a mesma combinação não desce abaixo de 4). A fórmula é critério metodológico interno para operacionalizar o subitem 1.5.4.4.5.3, não é fórmula prescrita pela NR-1."],["h3","2.5 Descumprimento de requisito específico de NR"],["p","NR-1, subitem 1.5.4.4.5.1: a gradação da probabilidade deve levar em consideração o cumprimento dos requisitos estabelecidos em NR e na legislação. Manual do MTE (2026), item 11.4: o não atendimento de requisito específico de NR sobre medida de prevenção eleva a probabilidade para a mais alta gradação, pois a medida é de cumprimento obrigatório, exemplo do próprio Manual: assentos em desacordo com o item 17.6.6 da NR-17."],["p","REGRA DA UNIDADE: identificado o descumprimento, Probabilidade = 5, independentemente da grade 2.4. O requisito descumprido é identificado na linha do inventário, a correção entra no Plano de Ação e, atendido e mantido o requisito, o risco é reavaliado."],["p","A elevação ao grau máximo é orientação do Manual do MTE, adotada pela unidade, não é redação literal da NR-1. Aplica-se só a requisito específico de NR sobre medida de prevenção; ausência de medida que a norma não exige nominalmente segue a grade 2.4."],["h3","2.6 Coerência entre exposição e probabilidade"],["p","Verificação obrigatória em todo lançamento: Tipo de Exposição, Duração, Intensidade, Exigência, Eficácia e Probabilidade da mesma linha devem ser coerentes entre si."],["p","Como a duração já compõe a Exigência (2.3.1), exposição habitual e permanente (duração longa, mais de 4 h) produz Exigência mínima 3 e, pela grade 2.4, Probabilidade mínima 2. Probabilidade 1 (Raro) com exposição habitual e permanente só aparece quando o avaliador diverge da grade, o que exige justificativa técnica registrada na memória de cálculo."],["p","REGRA: combinação incoerente é sinalizada para revisão. O lançamento só é aceito com a memória de cálculo corrigida ou com a justificativa da divergência registrada. A duração não é considerada uma segunda vez fora da Exigência."],["h3","2.7 Natureza dos critérios"],["p","Considerar exigências e eficácia decorre do subitem 1.5.4.4.5.3 da NR-1. Considerar duração e intensidade segue o Manual do MTE (item 11.4.2). Os critérios de duração × intensidade da Exigência vêm de publicação técnica da Inspeção do Trabalho (Revista da ENIT, 2025, Tabela 2), adaptada como escala de Exigência."],["p","São CRITÉRIO INTERNO desta organização: o uso da Tabela 2 como escala de Exigência, a equivalência de duração para fatores psicossociais, as definições de intensidade, a escala de Eficácia e a fórmula de conversão em Probabilidade. Definidos por [RESPONSÁVEL TÉCNICO: nome e registro] em [DATA], para dar uniformidade entre avaliadores e reprodutibilidade ao inventário."],["p","O avaliador pode divergir da grade, desde que registre a justificativa técnica na memória de cálculo da linha."],["p","A matriz corporativa Frequência × Bloqueio × Severidade não é adotada: duas matrizes no mesmo processo produziriam incoerência, e esta Seção já contempla a frequência (na Duração da Exigência) e o bloqueio (na Eficácia)."],["p","Alteração desta revisão: as faixas percentuais da jornada (menos de 10%, 10–25%, 26–50%, 51–75%, acima de 75%) foram substituídas pelos critérios de duração × intensidade da Tabela 2 da Revista da ENIT (2025). As faixas percentuais eram critério interno sem referência. A Eficácia passou a ser avaliada pela robustez e garantia das medidas, para que a mesma medida não seja descontada duas vezes. As referências de severidade passaram a ser descritas pela repercussão funcional, sem diagnóstico. Linhas graduadas pelo critério anterior são regraduadas na próxima reavaliação do cargo."],["h3","2.8 Severidade-âncora"],["p","A severidade é propriedade do perigo, não do local: o dano possível de um mesmo fator é o mesmo em qualquer setor. O que varia por local é a probabilidade."],["p","A âncora de cada perigo está na TAXONOMIA (tabela abaixo). Para os perigos de organização do trabalho (OT), a âncora é 2 e, para violência e assédio (OT-11), 4, pela magnitude dos possíveis agravos definidos com os médicos do trabalho; para esses perigos, o nível 1 não é utilizado. Para os demais, a âncora foi calibrada pelos agravos da Portaria MS 1.999/2023 (LDRT)."],["p","Pode ser ELEVADA com justificativa registrada na AEP (nexo estabelecido, CAT emitida, NTEP na atividade ou gravidade documentada em campo). NÃO pode ser reduzida."],["gen","ANCORAS"],["h3","REFERÊNCIAS"],["p","• NR-1 - Disposições Gerais e Gerenciamento de Riscos Ocupacionais, Capítulo 1.5 com redação da Portaria MTE nº 1.419/2024. Subitens citados: 1.5.4.4.5.1, 1.5.4.4.5.3, 1.5.4.4.6 e 1.5.7.3.2."],["p","• MTE. Manual de interpretação e aplicação do Capítulo 1.5 da NR-1 - Gerenciamento de Riscos Ocupacionais (GRO), 2026. Itens 11.4 e 11.4.2. Disponível em gov.br/trabalho-e-emprego (Inspeção do Trabalho › Manuais e publicações › 2026)."],["p","• MTE. Perguntas e Respostas GRO/PGR, 2026: itens 2, 10, 11 e 19."],["p","• [AUTORES]. [Título do artigo]. Revista da Escola Nacional da Inspeção do Trabalho, ano 9, 2025, p. 413 - Tabela 2, Gradações de probabilidade. Fontes da tabela: Generalitat de Catalunya (2006); FIRTH, I. et al. Simplified Occupational Hygiene Risk Management Strategies. AIOH, 2020; OCCHIPINTI, E.; COLOMBINI, D. (2016)."],["p","• NR-17 - Ergonomia. Itens 17.3.1, 17.3.2, 17.3.8 e 17.6.6."],["p","• Lei nº 8.213/1991, art. 60: afastamento superior a 15 dias (marco usado nas referências de severidade)."],["p","• Ministério da Saúde. Portaria GM/MS nº 1.999/2023 - Lista de Doenças Relacionadas ao Trabalho (LDRT)."],["h3","CONTROLE DE VERSÃO"],["table",[["Revisão","Data","Alteração","Responsável"],["[nº]","[data]","2.1: referências de severidade sem diagnóstico. 2.3.1: Exigência pelos critérios de duração × intensidade da Tabela 2 (Revista da ENIT, 2025), no lugar das faixas percentuais. 2.3.2: Eficácia por robustez e garantia das medidas. Incluídos: grade de conversão (2.4), descumprimento de NR (2.5), coerência (2.6), natureza dos critérios (2.7) e referências.","[nome]"],["[nº]","13/10/2026","Seção 1: o quadro de estados (NA, E0 a E3) deu lugar ao registro por domínio do Relatório Técnico FRPT e às regras de entrada após a AEP; amostra mínima de 5 respondentes; regras fixas 1, 2, 5, 6, 7 e 9 revistas. 2.2: nomenclatura da matriz do PGR (trivial, tolerável, moderado, substancial, intolerável), com a célula 10 em risco moderado. 2.8: âncora 2 para os perigos de organização do trabalho e 4 para violência e assédio.","[nome]"]]]];

/* Conclusão escrita pelo sistema a partir dos fatos da AEP (substitui a escolha manual da interpretação) */
const CAT_TXT = { "Biomecânicos": ["biomecânico", "biomecânicos"], "Mobiliários Máquinas Equipamentos e Ferramentas": ["de mobiliário, máquinas ou equipamentos", "de mobiliário, máquinas ou equipamentos"], "Conforto Ambiental": ["de conforto ambiental", "de conforto ambiental"], "Organização do Trabalho": ["de organização do trabalho e psicossocial", "de organização do trabalho e psicossociais"] };
const juntar = l => l.length <= 1 ? (l[0] || "") : `${l.slice(0, -1).join(", ")} e ${l[l.length - 1]}`;
const minusc = t => t ? t.charAt(0).toLowerCase() + t.slice(1) : t;
function classeAEP(a){
  if (ckLista(a).some(x => x.c.r === "sim")) return "critica";
  if ((a.perigos||[]).some(h => PERIGOS_DEFICIENCIA.has(h.codigo)) || DOMINIOS.some(d => Object.values(a.copsoq?.dominios?.[d.id]?.dec || {}).some(v => v === "melh" || v === "conf"))) return "melhoria";

const CLASSE_TXT = { critica: "Condições críticas, com intervenção prioritária.", melhoria: "Condições que requerem melhorias.", adequada: "Condições adequadas, sem necessidade de melhorias além da manutenção dos controles existentes." };

    const partes = Object.entries(porCat).map(([c, k]) => `${k} ${(CAT_TXT[c] || [c, c])[k > 1 ? 1 : 0]}`);
    P.push(`A avaliação do cargo ${cargo} identificou ${n} perigo${n > 1 ? "s" : ""} (${juntar(partes)}), que ${n > 1 ? "passam" : "passa"} a integrar o inventário de riscos do PGR. A graduação de cada risco é feita no inventário de riscos da unidade, considerando a exposição e as medidas de controle já existentes.`);
  } else P.push(`A avaliação do cargo ${cargo} não identificou perigos ergonômicos ou psicossociais que demandem registro no inventário de riscos do PGR.`);
  const crit = ckLista(a).filter(x => x.c.r === "sim");
  if (crit.length) P.push(`O checklist da NR-17 apontou ${crit.length} condiç${crit.length > 1 ? "ões críticas" : "ão crítica"}: ${juntar(crit.map(x => minusc(ckCurto(x.n))))}. ${crit.length > 1 ? "Essas condições requerem" : "Essa condição requer"} intervenção prioritária, conforme o Plano de Ação.`);
  else P.push("O checklist da NR-17 não apontou condição crítica de desqualificação ergonômica na situação avaliada.");
  const defic = [...new Set(hz.filter(h => PERIGOS_DEFICIENCIA.has(h.codigo) && !itensDoPerigo(a, h).length).map(h => minusc(TAXMAP[h.codigo]?.nome || h.codigo)))];
  if (defic.length) P.push(`Foram constatadas condições a melhorar em ${juntar(defic)}, tratadas nas recomendações desta AEP.`);
  const snap = copsoqDaAEP(a);
  if (snap){ const altas = altasComPerigo(a);
    const todasLanc = altas.every(s => hz.some(h => h.codigo === s.tax)), pl = altas.length > 1;
    P.push(altas.length ? `No rastreamento psicossocial do setor ${snap.nome} (COPSOQ II), ${altas.length} subescala${pl ? "s ficaram" : " ficou"} na faixa de risco, acima de 3,66 (${juntar(altas.map(s => minusc(s.nome)))}). ${todasLanc ? (pl ? "Esses resultados foram registrados" : "Esse resultado foi registrado") : (pl ? "Esses resultados devem ser registrados" : "Esse resultado deve ser registrado")} como perigo a partir da percepção coletiva do setor.`
      : `No rastreamento psicossocial do setor ${snap.nome} (COPSOQ II), nenhuma subescala ficou na faixa de risco.`); }

  else if (dec === "analise") P.push("A necessidade de Análise Ergonômica do Trabalho (AET) está em análise.");

/* Padrão de 15/10/2026, aplicado a todas as AEPs (concluídas, em revisão, em andamento e não iniciadas):
   item 12 do checklist retirado (os itens seguintes sobem uma posição), conclusão escrita pelo sistema,
   linhas fixas das recomendações montadas sozinhas e fonte dos perigos do COPSOQ alto como percepção coletiva. */
const PADRAO_AEP = 5;
function migrarAEP(r){
  if (!r || (r.padrao||0) >= PADRAO_AEP) return r;
  if ((r.padrao||0) < 3) migrarV3(r);
  /* v4: base do perigo. Lançado a partir do checklist = observado em campo; vindo do COPSOQ = percepção coletiva. Os demais ficam para informar. */
  (r.perigos||[]).forEach(h => { if (h.base) return; if (h.origemCopsoq) h.base = "copsoq"; else if (Number(h.autoItem) || Number(h.checkItem)) h.base = "observado"; });
  /* v5: a percepção do COPSOQ sai da fonte (vai para a base) */
  (r.perigos||[]).forEach(h => { if (PREFIXO_PERCEPCAO.test(String(h.fonte||""))) h.fonte = String(h.fonte).replace(PREFIXO_PERCEPCAO, ""); });
  r.padrao = PADRAO_AEP;
  return r;
}
function migrarV3(r){
  if (Array.isArray(r.checklist) && r.checklist.length >= 12){
    const tirado = r.checklist.splice(11, 1)[0];
    if (tirado && tirado.r === "sim"){ r.revisarItem12 = String(tirado.obs || "").trim() || "sim";
      if (r.status === "concluida"){ r.status = "revisao"; r.concluidoPrimeiro = r.concluidoPrimeiro || r.concluidoEm; r.concluidoEm = null; } }
  }
  (r.perigos||[]).forEach(h => {
    ["checkItem", "autoItem"].forEach(k => { const v = Number(h[k]); if (!v) return;
      if (v === 12){ h[k] = ""; h.revisar = "Este perigo vinha do item 12 do checklist (forma de trabalho que predispõe a acidentes), que foi retirado. Confira se ele continua."; }
      else if (v > 12) h[k] = v - 1; });
  });
  if (r.conclusao){
    if (r.conclusao.interpretacao) { r.conclusao.interpretacaoAntiga = r.conclusao.interpretacao; delete r.conclusao.interpretacao; }
    if (typeof r.conclusao.recomendacoes === "string"){ const base = new Set(TXT_RECOMENDACOES.split("\n").map(norm));
      r.conclusao.recomendacoes = r.conclusao.recomendacoes.split(/\n+/).map(x => x.trim()).filter(x => x && !linhaAuto(x, base)).join("\n"); }
  }
}
/* A percepção do COPSOQ é a base (a evidência) do perigo, não a fonte geradora: sai na linha "Base" do documento. */
const PREFIXO_PERCEPCAO = /^Percepção coletiva desfavorável do setor[^)]*\)\.\s*/;
function baseTexto(a, h){
  if (h.origemCopsoq){ const s = SUBMAP[h.origemCopsoq], sn = copsoqDaAEP(a), m = sn?.medias?.[h.origemCopsoq];
    if (s && faixaDe(m) === "ris") return `Percepção coletiva do setor${sn?.nome ? " " + sn.nome : ""} no COPSOQ II (${s.nome}: ${num2(m)}, acima de 3,66)`;
    return s ? `Percepção coletiva do setor no COPSOQ II (${s.nome}), confirmada na avaliação` : BASE_PERIGO.copsoq; }
  return BASE_PERIGO[h.base] || "";
}

const indSetor = a => { const ar = setorDaAEP(a), ind = ar?.ind || {}; const af = Number(ind.afast)||0, ca = Number(ind.canal)||0; return (af || ca) ? { af, ca, periodo: ind.periodo || "", fonte: ind.fonte || "" } : null; };
/* Perigos de exigência esperados em posto administrativo e ainda não lançados */
const esperadosFaltando = a => a.checklistAdm === "sim" ? PERIGOS_ADM_ESPERADOS.filter(c => !(a.perigos||[]).some(h => h.codigo === c)) : [];
/* Perigo de deficiência lançado com todos os itens do checklist ligados a ele conformes (nenhum marcado Sim) */
function deficienciaSemItem(a){
  return (a.perigos||[]).filter(h => PERIGOS_DEFICIENCIA.has(h.codigo)).map(h => {
    const lig = ckLista(a).filter(x => x.c.r && x.c.r !== "na" && perigoLigaItem(a, h, x.n));
    return lig.length && !lig.some(x => x.c.r === "sim") ? { h, itens: lig.map(x => x.n) } : null; }).filter(Boolean);

/* Mesma linha repetida: mesmo perigo com a mesma fonte geradora */
const chaveHz = h => h.codigo + "|" + norm(h.fonte);
function perigosRepetidos(a){

function faixaDe(m){ if (m === "" || m == null || isNaN(Number(m))) return null; const v = Number(m); return v < 2.34 ? "fav" : v <= 3.66 ? "int" : "ris"; }

function snapDe(setor){ return setor ? { setorId: setor.id, nome: setor.nome, n: setor.n||"", onda: setor.onda||"", dataCorte: setor.dataCorte||"", dominios: clone(setor.dominios||{}), medias: clone(setor.medias||{}), atualizadoEm: setor.atualizadoEm||"" } : null; }
function copsoqDaAEP(a){ return a.copsoq?.snapshot || snapDe(setorPorNome(a.meta?.setorCopsoq)); }
function resultadoDominio(a, domId){

/* ---------------- Conferência dos perigos (todas as AEPs) ---------------- */
function conferenciaPerigos(){
  const semPadrao = [], defic = [], rep = [], semLanc = [], velhas = [], comPend = [], redAnt = [], grupos = {};
  Object.values(S.aeps).forEach(a0 => { const a = completar(a0);
    (a.perigos||[]).forEach(h => { const t = TAXMAP[h.codigo]; if (!t) return;
      if (!temPrefixoPadrao(h)) semPadrao.push({ a, h }); });
    deficienciaSemItem(a).forEach(x => defic.push({ a, h: x.h, itens: x.itens }));
    if (temRedacaoAntiga(a)) redAnt.push({ a });
    perigosRepetidos(a).forEach(([x, y]) => rep.push({ a, x, y }));
    if (a.status === "concluida"){ const pd = pendencias(a), n = totalPend(pd); if (n) comPend.push({ a, txt: Object.values(pd).flat()[0] + (n > 1 ? ` (+${n-1})` : "") }); }
    if (a.status === "concluida"){ const c = a.classif || {}, xs = (a.perigos || []).filter(h => h.idRisco && TAXMAP[h.codigo]).map(h => ({ a, h, c: c[h.idRisco] || {}, r: calcRisco(h, c[h.idRisco]) })).filter(x => x.r.sit === "ok");
      const nv = xs.filter(x => estadoPGR(x) === "novo").length, alt = xs.filter(x => estadoPGR(x) === "alterado").length;
      if (nv) semLanc.push({ a, n: nv }); if (alt) velhas.push({ a, n: alt }); }
    if ((a.status||"nao_iniciada") !== "nao_iniciada" && (a.perigos||[]).length){ const k = norm(a.meta?.cargo); if (k) (grupos[k] = grupos[k] || []).push(a); } });
  const cargos = Object.values(grupos).filter(g => g.length > 1 && new Set(g.map(a => [...new Set(a.perigos.map(h => h.codigo))].sort().join(","))).size > 1)
    .map(g => ({ a: g[0], g: g.sort((p, q) => idNum(p) - idNum(q)) }));
  const ord = l => l.sort((p, q) => idNum(p.a) - idNum(q.a));
  const difModelo = Object.values(S.aeps).filter(a => modeloPendente(completar(a))).map(a => ({ a }));
  return { difModelo: ord(difModelo), semPadrao: ord(semPadrao), defic: ord(defic), rep: ord(rep), semLanc: ord(semLanc), velhas: ord(velhas), comPend: ord(comPend), redAnt: ord(redAnt), cargos: ord(cargos) };
}

  const lista = (l, f) => l.slice(0, 40).map(f).join("") + (l.length > 40 ? `<p class="tiny muted">+ ${l.length - 40} outro(s)</p>` : "");
  const conf = S.confirm === "fontes", nAeps = new Set(c.semPadrao.map(x => x.a.id)).size;

/* ---------------- TAXONOMIA editável, com controle de versão ----------------
   Versão 1 = a TAXONOMIA que veio da planilha + PCRE (TAX_BASE, fixa no código).
   As mudanças ficam em config/taxonomia = { versao, em, itens, historico, rascunho }:
   itens = o que difere da base (por código e campo); rascunho = cópia de itens em edição, que só vale depois de publicada. */
const TAX_BASE = JSON.parse(JSON.stringify(TAX_RAW));
const DEF_BASE = new Set(PERIGOS_DEFICIENCIA), ALT_BASE = JSON.parse(JSON.stringify(FONTES_ALTERNATIVAS));

const TAX_PREF = ["OT", "BIO", "EQ", "AMB"];
const TAX_CATS = { OT: "Organização do Trabalho", BIO: "Biomecânicos", EQ: "Mobiliários Máquinas Equipamentos e Ferramentas", AMB: "Conforto Ambiental" };
const TAX_CAMPOS = [
  ["nome", "Perigo / fator de risco", "text"], ["sub", "Subcategoria", "text"], ["area", "Área da NR-17 (17.1.1.1)", "area"],
  ["natureza", "Natureza do perigo", "natureza"], ["ancora", "Severidade-âncora", "sev"],
  ["danos", "Possíveis danos à saúde", "longo"], ["fonte", "Fonte geradora padrão", "longo"], ["fonteAlt", "Fonte geradora alternativa (opcional)", "longo"],
  ["campos", "Campos locais a coletar em campo", "longo"], ["medidas", "Medidas típicas", "longo"], ["evidencia", "Evidência esperada da medida", "longo"],
  ["itens", "Itens do checklist que acionam o perigo (1 a 13)", "itens"], ["subescalas", "Subescalas do COPSOQ relacionadas", "text"],
  ["inerente", "Exigência inerente à função (texto do COPSOQ)", "check"], ["cid", "CID relacionados", "text"], ["base", "Base normativa", "text"], ["inativo", "Desativado", "check"] ];
const TAX_ROT = Object.fromEntries(TAX_CAMPOS.map(([k, r]) => [k, r]));
const NATUREZA_ROT = { exigencia: "Exigência (lança quando existe no trabalho real)", deficiencia: "Deficiência (lança só quando a condição inadequada é constatada)" };
const ordTax = (x, y) => TAX_PREF.indexOf(prefixo(x.codigo)) - TAX_PREF.indexOf(prefixo(y.codigo)) || (Number(String(x.codigo).split("-")[1]) || 0) - (Number(String(y.codigo).split("-")[1]) || 0);
/* valor de um campo na base (versão 1) */
function taxBaseValor(cod, campo){
  const t = TAX_BASE.find(x => x.codigo === cod);
  if (campo === "natureza") return t ? (DEF_BASE.has(cod) ? "deficiencia" : "exigencia") : "";
  if (campo === "fonteAlt") return (ALT_BASE[cod] || [])[0] || "";
  if (campo === "inativo") return false;
  if (!t) return campo === "itens" ? [] : campo === "inerente" ? false : "";
  return t[campo] ?? (campo === "itens" ? [] : "");
}
/* valor de um campo num conjunto de mudanças (publicado ou rascunho) */
function taxValor(itens, cod, campo){ const o = (itens || {})[cod]; return o && Object.prototype.hasOwnProperty.call(o, campo) ? o[campo] : taxBaseValor(cod, campo); }
const taxIgual = (a, b) => JSON.stringify(a ?? "") === JSON.stringify(b ?? "");
function taxCodigos(itens){ return [...new Set([...TAX_BASE.map(t => t.codigo), ...Object.keys(itens || {})])]; }
function aplicarTaxonomia(itens){
  itens = itens || {};
  TAX.length = 0;
  taxCodigos(itens).forEach(cod => { const base = TAX_BASE.find(x => x.codigo === cod) || { codigo: cod, cat: TAX_CATS[prefixo(cod)] || "", prov: false };
    const t = JSON.parse(JSON.stringify(base));
    ["nome", "sub", "area", "ancora", "danos", "fonte", "campos", "medidas", "evidencia", "itens", "subescalas", "inerente", "cid", "base"].forEach(k => { t[k] = taxValor(itens, cod, k); });
    t.cat = TAX_CATS[prefixo(cod)] || t.cat; t.inativo = !!taxValor(itens, cod, "inativo"); t.novo = !TAX_BASE.some(x => x.codigo === cod);
    TAX.push(t); });
  TAX.sort(ordTax);
  Object.keys(TAXMAP).forEach(k => delete TAXMAP[k]); TAX.forEach(t => { TAXMAP[t.codigo] = t; });
  PERIGOS_DEFICIENCIA.clear(); TAX.forEach(t => { if (taxValor(itens, t.codigo, "natureza") === "deficiencia") PERIGOS_DEFICIENCIA.add(t.codigo); });
  Object.keys(FONTES_ALTERNATIVAS).forEach(k => delete FONTES_ALTERNATIVAS[k]);
  TAX.forEach(t => { const alt = taxValor(itens, t.codigo, "fonteAlt"); if (String(alt || "").trim()) FONTES_ALTERNATIVAS[t.codigo] = [alt]; });
  Object.keys(FONTES_ANTERIORES).forEach(k => delete FONTES_ANTERIORES[k]);
  Object.entries(itens).forEach(([cod, o]) => { if ((o.fontesAnteriores || []).length) FONTES_ANTERIORES[cod] = o.fontesAnteriores.slice(); });
  recalcCK();
}
/* mudanças entre dois conjuntos (publicado x rascunho) */
function taxDiferencas(de, para){
  const out = [];
  taxCodigos({ ...(de || {}), ...(para || {}) }).forEach(cod => TAX_CAMPOS.forEach(([campo]) => {
    const a = taxValor(de, cod, campo), b = taxValor(para, cod, campo);
    if (!taxIgual(a, b)) out.push({ codigo: cod, campo, de: a, para: b, novo: !TAX_BASE.some(x => x.codigo === cod) && !(de || {})[cod] }); }));
  return out;
}
const taxPub = () => S.tax.itens || {};
const taxRasc = () => S.taxDraft || taxPub();
const taxTemRascunho = () => !!S.taxDraft && taxDiferencas(taxPub(), S.taxDraft).length > 0;
/* uso de cada código nas AEPs, no Inventário e no PGR */
function taxUso(cod){
  let perigos = 0, aeps = 0, classif = 0, pgr = 0;
  Object.values(S.aeps).forEach(a => { const hs = (a.perigos || []).filter(h => h.codigo === cod); if (!hs.length) return; aeps++; perigos += hs.length;
    hs.forEach(h => { const c = (a.classif || {})[h.idRisco]; if (!c) return; const r = calcRisco(h, c); if (r.sit === "ok") classif++; if (a.status === "concluida" && c.pgr?.em) pgr++; }); });
  return { perigos, aeps, classif, pgr };
}
/* efeito da publicação nos riscos já classificados (âncora) e nas linhas já enviadas ao PGR (nome, danos, âncora) */
function taxImpacto(mud){
  const anc = {}, txt = new Set(); mud.forEach(m => { if (m.campo === "ancora") anc[m.codigo] = Number(m.para) || 2; if (["nome", "danos", "ancora"].includes(m.campo)) txt.add(m.codigo); });
  let mudaCat = 0, voltaPGR = 0; const cods = new Set([...Object.keys(anc), ...txt]);
  Object.values(S.aeps).forEach(a => (a.perigos || []).filter(h => cods.has(h.codigo)).forEach(h => { const c = (a.classif || {})[h.idRisco]; if (!c) return; const r = calcRisco(h, c); if (r.sit !== "ok") return;
    let cat = r.cat; if (anc[h.codigo] != null){ const S2 = Math.max(anc[h.codigo], Number(c.sev) || anc[h.codigo]); cat = categoriaDe(r.P * S2); if (cat !== r.cat) mudaCat++; }
    if (a.status === "concluida" && c.pgr?.em) voltaPGR++; }));

/* ---------------- Avisos de conferência de cada AEP ----------------
   Antes ficavam na aba Pendências. Agora aparecem na lista de AEPs e dentro da própria AEP;
   o que é do PGR fica no Inventário e as correções em lote ficam em Unidade. */
const AVISO_CACHE = new WeakMap();
/* cada aviso tem um texto curto (lista de AEPs) e a explicação com o que fazer (dentro da AEP) */
function avisosAEP(a0){
  if (!a0) return [];
  if (AVISO_CACHE.has(a0)) return AVISO_CACHE.get(a0);
  const a = completar(a0), out = [], av = (curto, longo) => out.push({ curto, longo });
  if (modeloPendente(a)) av("Etapa 3 fora do modelo do setor", "A etapa 3 (COPSOQ) está diferente do texto-modelo do setor. Confira a etapa 3 ou use a correção em lote em Unidade.");
  const sp = (a.perigos || []).filter(h => TAXMAP[h.codigo] && !temPrefixoPadrao(h));
  if (sp.length) av(`Fonte fora do padrão (${sp.map(h => h.idRisco || h.codigo).join(", ")})`, `A fonte geradora de ${sp.map(h => h.idRisco || h.codigo).join(", ")} não começa pelo texto padrão da TAXONOMIA. Abra o perigo na etapa 4 e use o texto padrão, mantendo o seu complemento.`);
  deficienciaSemItem(a).forEach(x => av(`Perigo sem item do checklist (${x.h.idRisco || x.h.codigo})`, `${x.h.idRisco || ""} ${x.h.codigo} é um perigo de deficiência, mas os itens ${x.itens.join(", ")} do checklist estão marcados “Não”. Marque o item que mostra a condição ou retire o perigo.`));
  perigosRepetidos(a).forEach(([x, y]) => av(`Perigo repetido (${x.idRisco || ""} e ${y.idRisco || ""})`, `${x.idRisco || ""} e ${y.idRisco || ""} têm o mesmo perigo (${x.codigo}) e a mesma fonte. Retire um deles ou escreva fontes diferentes.`));
  if (temRedacaoAntiga(a)) av("Texto do COPSOQ desatualizado", "A observação do COPSOQ na etapa 3 usa o modelo antigo de texto. Na etapa 3, use “Atualizar a redação”.");
  if (a.status === "concluida"){ const pd = pendencias(a), n = totalPend(pd); if (n) av("Concluída antes de uma regra nova", `Esta AEP foi concluída antes de uma regra que entrou depois: ${Object.values(pd).flat()[0]}${n > 1 ? ` (e mais ${n - 1})` : ""}. Abra, resolva e conclua de novo.`); }
  AVISO_CACHE.set(a0, out); return out;
}
function vAvisosAEP(a0){
  const av = avisosAEP(a0); if (!av.length) return "";
  return `<div class="note warn" style="margin-bottom:12px"><b>Pontos para conferir nesta AEP</b> <span class="tiny">(não impedem nada; são ajustes de qualidade)</span><ul class="avisos">${av.map(x => `<li><b>${esc(x.curto.replace(/\s*\(.*\)$/, ""))}:</b> ${esc(x.longo)}</li>`).join("")}</ul></div>`;
}

function abrirHz(h){
  S.editHz = Object.assign({ id: uid(), codigo:"", fonte:"", danos:"", exposicao:"", checkItem:"", origemCopsoq:"", base:"" }, h);
  S.hzErr = ""; S.hzFiltro = ""; S.hzCat = h && h.codigo ? prefixo(h.codigo) : "";
}
function salvarHz(){
  const h = S.editHz, t = TAXMAP[h.codigo]; const erro = m => { S.hzErr = m; renderStep(); };
  if (!t) return erro("Selecione o perigo na taxonomia.");
  if (!h.fonte?.trim()) return erro("Descreva a fonte geradora específica desta situação.");
  if (!h.origemCopsoq && !BASE_PERIGO[h.base]) return erro("Indique a base: observado em campo, relatado pelo trabalhador ou rotina do cargo.");
  const igual = S.draft.perigos.find(x => x.id !== h.id && chaveHz(x) === chaveHz(h));
  if (igual) return erro(`Já existe a linha ${igual.idRisco||""} com o mesmo perigo (${h.codigo}) e a mesma fonte. Edite a linha existente, ou complemente a fonte com o que torna esta situação diferente.`);
  const novo = clone(h); delete novo._novo; if (!novo.danos) novo.danos = t.danos;
  const orig = Number(novo.checkItem), listaOrig = CK_PERIGOS[orig] || [];
  if (orig && listaOrig.length && !listaOrig.includes(novo.codigo)) setTimeout(() => toast(`${novo.codigo} não está entre os perigos do item ${orig} (${listaOrig.join(", ")}): o item continua sem vínculo. Se ele responde ao item, vincule no checklist.`), 50);
  const i = S.draft.perigos.findIndex(x => x.id === novo.id);
  if (i >= 0) S.draft.perigos[i] = novo; else S.draft.perigos.push(novo);
  S.editHz = null; S.hzErr = ""; marcar(); numerarRiscos(S.draft); renderStep(); renderRail(); renderAside(); toast("Perigo salvo.");
}

/* ---------------- Fotos ---------------- */
async function comprimir(file){
  const url = URL.createObjectURL(file);
  try { const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); return await new Promise(ok => c.toBlob(ok, "image/jpeg", .82));
  } finally { URL.revokeObjectURL(url); }
}
async function enviarFotos(files){
  if (!S.assets) return; const lista = Array.from(files).filter(f => f.type.startsWith("image/")), msg = $("#upmsg");
  for (let k=0; k<lista.length; k++){ if (msg) msg.textContent = `Enviando foto ${k+1} de ${lista.length}…`;
    try { const r = await S.assets.upload(await comprimir(lista[k]), { type: "image/jpeg" }); S.draft.fotos.push({ id: uid(), assetId: r.id, titulo: "" }); marcar(); await salvarAEP(); }
    catch(e){ toast(e && e.code === "too_large" ? "Foto grande demais." : e && e.code === "quota_or_state" ? "O espaço para fotos acabou." : "Não foi possível enviar uma das fotos."); } }
  if (msg) msg.textContent = lista.length ? "Envio concluído. Escreva a legenda de cada ação técnica." : ""; renderStep(); renderRail();
}

async function gerarPDF(){

  const tituloApp = document.title, nome = nomeArquivo(`${S.draft.numero} - ${S.draft.meta.cargo || "AEP"}`);
  let fr = null;
  try {
    const fotos = [];
    for (const f of S.draft.fotos||[]) fotos.push({ src: await paraDataURL(f.assetId), titulo: f.titulo });
    const html = docHTML(S.draft, S.config, fotos.filter(f => f.src), { preview: true, logo: (typeof logoDataURL === "function" ? await logoDataURL() : "") || undefined })
      .replace(/<title>[^<]*<\/title>/, `<title>${esc(nome)}</title>`);

    fr.style.cssText = "position:fixed;right:0;bottom:0;width:210mm;height:10px;border:0;opacity:0;pointer-events:none";
    document.body.appendChild(fr);
    await new Promise(ok => { fr.onload = ok; fr.srcdoc = html; });
    const doc = fr.contentDocument;
    await Promise.all(Array.from(doc.images).map(i => i.complete ? 0 : new Promise(ok => { i.onload = i.onerror = ok; })));
    try { await doc.fonts.ready; } catch(_){}
    document.title = nome;
    fr.contentWindow.focus(); fr.contentWindow.print();
  } catch(e){ toast("Não foi possível preparar o PDF. Tente de novo."); }

    document.title = tituloApp;
    setTimeout(() => { if (fr) fr.remove(); }, 1000);

  }
}

`;

/* Imprime um HTML num quadro escondido, com o nome sugerido do arquivo */
async function imprimirHTML(html, nome){
  const tituloApp = document.title; let fr = null;
  try {
    fr = document.createElement("iframe"); fr.setAttribute("aria-hidden", "true"); fr.tabIndex = -1;
    fr.style.cssText = "position:fixed;right:0;bottom:0;width:210mm;height:10px;border:0;opacity:0;pointer-events:none";
    document.body.appendChild(fr);
    await new Promise(ok => { fr.onload = ok; fr.srcdoc = html; });
    const doc = fr.contentDocument;
    await Promise.all(Array.from(doc.images).map(i => i.complete ? 0 : new Promise(ok => { i.onload = i.onerror = ok; })));
    try { await doc.fonts.ready; } catch(_){}
    document.title = nome; fr.contentWindow.focus(); fr.contentWindow.print();
  } finally { document.title = tituloApp; setTimeout(() => { if (fr) fr.remove(); }, 1000); }
}
/* Várias AEPs num PDF só: cada uma começa numa página nova */
async function gerarPDFVarias(){
  const btn = $("#btnPDFsel"); if (!btn || btn.disabled) return;
  const ids = Object.values(S.aeps).filter(a => S.sel.has(a.id)).sort((a, b) => idNum(a) - idNum(b)).map(a => a.id); if (!ids.length) return;
  btn.disabled = true;
  try {

const nomeArquivo = s => String(s).replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g," ").trim().slice(0,120);
async function baixarDoc(){
  if (!S.downloads) return;
  const btn = $("#btnBaixar"); if (btn){ btn.disabled = true; btn.textContent = "Preparando…"; }
  try {
    const fotos = [];
    for (const f of S.draft.fotos||[]) fotos.push({ src: await paraDataURL(f.assetId), titulo: f.titulo });
    const html = docHTML(S.draft, S.config, fotos.filter(f => f.src), { logo: (await logoDataURL()) || undefined });
    await S.downloads.save({ filename: nomeArquivo(`${S.draft.numero} - ${S.draft.meta.cargo || "AEP"}`) + ".html", data: html });
    toast("Documento baixado. Abra o arquivo para imprimir ou salvar em PDF.");
  } catch(e){
    if (!e || e.code !== "declined") toast(e && e.code === "rate_limited" ? "Aguarde um instante e tente de novo." : "Não foi possível baixar o documento.");
  } finally { if (btn){ btn.disabled = false; btn.textContent = "Baixar documento (HTML)"; } }
}

/* Linhas do PGR: perigos de AEPs concluídas com a classificação completa e sem alerta no Inventário.
   Cada linha guarda, ao ser marcada como enviada, a data e uma assinatura das colunas C a Z (c.pgr = { em, sig }).
   Se a classificação mudar depois, a assinatura deixa de bater e a linha volta para o próximo envio. */

  const { a, h, c, r } = x, t = TAXMAP[h.codigo] || {}, med = String(c.medidas || "").trim();
  return [String(a.meta?.eg || ""), (a.meta?.cargo || "").trim(), `${a.numero} / ${h.idRisco}`, "Ergonomico", t.nome || "", String(h.fonte || "").trim(), "NA", "NA", t.danos || h.danos || "",
    c.exp || "", PGR_TECNICA(h), "NA", "NA", "NA", "NA", "NA", c.catIni || "", c.hier && c.hier !== "Não aplicável" && med ? `${c.hier}: ${med}` : med, c.eficaz || "", "NA", "NA",

    case "redacaoTodasSim": {
      const alvo = conferenciaPerigos().redAnt.map(x => x.a.id); let n = 0, erro = 0;
      for (const id of alvo){ const a2 = completar(S.aeps[id]); if (!atualizarRedacao(a2)) continue; n++;
        if (a2.status === "concluida") { a2.status = "revisao"; a2.concluidoPrimeiro = a2.concluidoPrimeiro || a2.concluidoEm; a2.concluidoEm = null; }
        a2.atualizadoEm = new Date().toISOString(); S.aeps[id] = a2;
        if (S.db) { try { await S.db.doc("aeps/" + id).set(a2); } catch(_) { erro++; } } }
      S.confirm = null; render(); toast(erro ? `Redação atualizada em ${n - erro} AEP(s); ${erro} não salvaram — tente de novo.` : `Redação atualizada em ${n} AEP(s).`); break;
    }
    case "atualizarRedacao": { const n = atualizarRedacao(a); if (n) { marcar(); renderStep(); renderRail(); renderAside(); toast(`Redação atualizada em ${n} trecho(s). Confira o texto de cada domínio.`); } break; }
    case "txtSub": case "txtFecho": {
      const dd = a.copsoq.dominios[d.dom], dm = DOMINIOS.find(x => x.id === d.dom), atual = (dd.obs||"").trim();
      let novo;
      if (d.act === "txtSub"){ const s = SUBMAP[d.sub], snap = copsoqDaAEP(a), m = snap?.medias?.[s.id]; novo = fraseSub(a, s, m, faixaDe(m), d.v); dd.dec = Object.assign({}, dd.dec, { [s.id]: d.v }); }
      else novo = fraseFecho(a, d.dom, d.v);
      if (d.v === "padrao" && atual && atual !== dm.padrao){ toast("Apague o texto atual antes de usar o texto padrão."); break; }
      dd.obs = (!atual || atual === dm.padrao) ? novo : atual + "\n" + novo;
      marcar(); renderStep(); renderRail(); renderAside();
      const ta = $("#f-obs-" + d.dom); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
      break;
    }
    case "justAetPadrao": {
      const atual = (a.aet.justificativa||"").trim();
      if (atual && ![TXT_JUST_AET_NAO, TXT_JUST_AET_NAO_SEM].includes(atual)){ toast("Apague o texto atual antes de usar o texto padrão."); break; }
      a.aet.justificativa = temAcao(a) ? TXT_JUST_AET_NAO : TXT_JUST_AET_NAO_SEM; marcar(); renderStep(); renderRail(); renderAside();
      toast(temAcao(a) ? "Texto com ações no Plano de Ação (há item crítico, deficiência confirmada ou interpretação com melhorias)." : "Texto sem ações: medidas existentes suficientes."); break;
    }
    case "usarSug": { const r = resultadoDominio(a, d.dom); a.copsoq.dominios[d.dom].concl = conclusaoSugerida(r); marcar(); renderStep(); renderRail(); renderAside(); break; }
    case "atualizarSnap": { const set = S.areas[a.copsoq.snapshot?.setorId] || setorPorNome(a.meta.setorCopsoq); a.copsoq.snapshot = snapDe(set); marcar(); renderBanner(); renderStep(); renderRail(); renderAside(); toast("Notas do setor atualizadas nesta AEP."); break; }
    case "ftUp": case "ftDown": { const i = Number(d.i), j = d.act === "ftUp" ? i-1 : i+1, F = a.fotos; [F[i],F[j]] = [F[j],F[i]]; marcar(); renderStep(); break; }
    case "rmFt": S.confirm = "ft-" + d.id; renderStep(); break;
    case "ftGirar": {
      const f = a.fotos.find(x => x.id === d.id); if (!f || !S.assets || S.girando) break;
      S.girando = true; toast("Girando a foto…");
      try {
        const src = await paraDataURL(f.assetId); if (!src) throw new Error("foto");
        const img = await new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = src; });
        const c = document.createElement("canvas"), g = Number(d.g);
        c.width = img.naturalHeight; c.height = img.naturalWidth;
        const ctx = c.getContext("2d"); ctx.translate(c.width / 2, c.height / 2); ctx.rotate(g * Math.PI / 180); ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
        const blob = await new Promise(ok => c.toBlob(ok, "image/jpeg", 0.9));
        const r = await S.assets.upload(blob, { type: "image/jpeg" });
        const antigo = f.assetId; f.assetId = r.id; marcar(); await salvarAEP(); renderStep();
        try { await S.assets.delete(antigo); } catch(_){}
        toast("Foto girada.");
      } catch(e){ toast("Não foi possível girar a foto. Tente de novo."); }
      S.girando = false; break;
    }
    case "rmFtSim": {
      const f = a.fotos.find(x => x.id === d.id);
      a.fotos = a.fotos.filter(x => x.id !== d.id); S.confirm = null; marcar(); await salvarAEP();
      if (f && S.assets) { try { await S.assets.delete(f.assetId); } catch(_){} }
      renderStep(); renderRail(); break;
    }
    case "novaArea": S.editArea = completarArea(null); S.areaDirty = false; S.colar = ""; S.colarMsg = ""; render(); break;
    case "voltarAreas": await salvarArea(); S.editArea = null; S.confirm = null; render(); break;
    case "delArea": S.confirm = "delArea"; render(); break;
    case "delAreaSim": {
      const id = S.editArea.id; clearTimeout(S.areaTimer); S.areaDirty = false;
      if (S.db) { try { await S.db.doc("copsoq/" + id).delete(); } catch(_){ toast("Não foi possível excluir."); return; } }
      delete S.areas[id]; S.editArea = null; S.confirm = null; render(); toast("Setor excluído."); break;
    }
    case "colar": importarColagem(); break;
  }
});
function rerender(){
  if (S.view === "aep"){ renderTitulo(); renderStep(); }
  else render();
}

/* Salva antes de sair da página */
window.addEventListener("pagehide", () => { salvarAEP(); salvarArea(); });

</script>
<script>
/* =========================================================================
   PONTE SUPABASE — substitui o banco, as fotos e os downloads do Artifact.
   O resto do sistema chama window.claude.use("db" | "assets" | "downloads")
   exatamente como antes.
   ========================================================================= */
const SUPA_URL = "https://ewtbcwubdlxaybaqiqzx.supabase.co";
const SUPA_KEY = "sb_publishable_XCL2AkQyHHA6-F-Pu5ERgA_3WSZFqpY";
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);
const BUCKET = "fotos";

async function lerTudo(col){
  let out = [], from = 0;
  for (;;){
    const { data, error } = await sb.from(col).select("id,data").range(from, from + 999);
    if (error) throw error;
    out = out.concat(data || []);
    if (!data || data.length < 1000) break;
    from += 1000;
  }
  return out;
}
const docSnap = (id, data) => ({ id, exists: data != null, data: () => data });
const dbShim = {
  collection(col){
    return { onSnapshot(cb, err){
      lerTudo(col).then(rows => cb({ docs: rows.map(r => docSnap(r.id, r.data)) })).catch(e => { console.error(e); err && err(e); });
      return () => {};
    } };
  },
  doc(path){
    const [col, id] = path.split("/");
    return {
      async set(obj){
        const { error } = await sb.from(col).upsert({ id, data: obj, updated_at: new Date().toISOString() });
        if (error) throw error;
      },
      async delete(){
        const { error } = await sb.from(col).delete().eq("id", id);
        if (error) throw error;
      },
      onSnapshot(cb, err){
        sb.from(col).select("data").eq("id", id).maybeSingle()
          .then(({ data, error }) => { if (error) throw error; cb(docSnap(id, data ? data.data : null)); })
          .catch(e => { console.error(e); err && err(e); });
        return () => {};
      }
    };
  }
};
const novoIdFoto = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join("");
const assetsShim = {
  async upload(blob, opt = {}){
    const id = novoIdFoto();
    const { error } = await sb.storage.from(BUCKET).upload(id + ".jpg", blob, { contentType: opt.type || "image/jpeg", upsert: false });
    if (error) throw error;
    return { id };
  },
  async delete(id){
    const { error } = await sb.storage.from(BUCKET).remove([id + ".jpg"]);
    if (error) throw error;
    FOTO_URL.delete(id);
  }
};
const downloadsShim = {
  async save({ filename, data }){
    const blob = data instanceof Blob ? data : new Blob([data], { type: typeof data === "string" ? "text/html;charset=utf-8" : "application/octet-stream" });
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = filename; a.style.display = "none"; document.body.appendChild(a); a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 4000);
  }
};
window.claude = { use: async n => ({ db: dbShim, assets: assetsShim, downloads: downloadsShim })[n] || null };

/* ---------- Fotos: o bucket é privado; cada <img data-foto="id"> recebe um link temporário ----------
   O link vale 12 h. Ele é renovado sozinho depois de 10 h (aba aberta por muito tempo)
   e também quando uma imagem falha ao carregar. */
const FOTO_VALIDADE = 12 * 3600, FOTO_RENOVA_MS = 10 * 3600 * 1000;
const FOTO_URL = new Map();                       // id -> { u: link, t: quando foi gerado }
const fotoLink = id => { const x = FOTO_URL.get(id); if (!x) return ""; if (Date.now() - x.t > FOTO_RENOVA_MS) { FOTO_URL.delete(id); return ""; } return x.u; };
let fotoPend = new Set(), fotoTimer = null;
async function buscarFotos(){
  const ids = [...fotoPend]; fotoPend = new Set();
  for (let i = 0; i < ids.length; i += 100){
    const lote = ids.slice(i, i + 100);
    const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(lote.map(x => x + ".jpg"), FOTO_VALIDADE);
    if (error) { console.error(error); continue; }
    const agora = Date.now();
    (data || []).forEach(r => { if (r.signedUrl) FOTO_URL.set(String(r.path).replace(/\.jpg$/, ""), { u: r.signedUrl, t: agora }); });
  }
  aplicarFotos();
}
function aplicarFotos(){
  let falta = false;
  document.querySelectorAll("img[data-foto]").forEach(img => {
    const id = img.dataset.foto, u = fotoLink(id);
    if (u) { if (img.getAttribute("src") !== u) img.src = u; }
    else if (id) { fotoPend.add(id); falta = true; }
  });
  if (falta) { clearTimeout(fotoTimer); fotoTimer = setTimeout(buscarFotos, 40); }
}
async function urlsFotos(ids){
  const falta = ids.filter(i => !fotoLink(i));
  if (falta.length) { falta.forEach(i => fotoPend.add(i)); await buscarFotos(); }
  return ids.map(i => fotoLink(i));
}
new MutationObserver(aplicarFotos).observe(document.body, { childList: true, subtree: true });
/* imagem que não carregou (link vencido): descarta o link e pede outro, uma vez por link */
document.addEventListener("error", ev => {
  const img = ev.target; if (!img || img.tagName !== "IMG" || !img.dataset || !img.dataset.foto) return;
  const id = img.dataset.foto, x = FOTO_URL.get(id);
  if (x && img.getAttribute("src") === x.u && img.dataset.tentou !== x.u) { img.dataset.tentou = x.u; FOTO_URL.delete(id); aplicarFotos(); }
}, true);
/* aba voltou a ficar visível depois de muito tempo: renova os links vencidos */
document.addEventListener("visibilitychange", () => { if (!document.hidden) aplicarFotos(); });

const blobParaDataURL = b => new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = no; fr.readAsDataURL(b); });
async function paraDataURL(assetId){
  try { const { data, error } = await sb.storage.from(BUCKET).download(assetId + ".jpg"); if (error) throw error; return await blobParaDataURL(data); }
  catch(e){ return ""; }
}
async function logoDataURL(){
  try { const r = await fetch("logo.png"); if (!r.ok) throw 0; return await blobParaDataURL(await r.blob()); } catch(e){ return ""; }
}

/* ---------- Login ---------- */
async function entrar(){
  const { data } = await sb.auth.getSession();
  if (data && data.session) { document.getElementById("login").hidden = true; iniciar(); return; }
  document.getElementById("login").hidden = false;
  document.getElementById("login-email").focus();
}
document.getElementById("login-form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = document.getElementById("login-btn"), msg = document.getElementById("login-msg");
  btn.disabled = true; msg.textContent = "Entrando…";
  const { error } = await sb.auth.signInWithPassword({ email: document.getElementById("login-email").value.trim(), password: document.getElementById("login-senha").value });
  btn.disabled = false;
  if (error) { msg.textContent = /invalid/i.test(error.message) ? "E-mail ou senha incorretos." : "Não foi possível entrar: " + error.message; return; }
  msg.textContent = ""; document.getElementById("login").hidden = true; iniciar();
});
document.getElementById("btn-sair").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });

entrar();
</script>
